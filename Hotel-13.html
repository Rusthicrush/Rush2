<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golden Spoon Hotel</title>
<style>
/* ===== ONE UI · Golden Spoon Hotel (shop) ===== */
:root{--mist:#f2f3f7;--paper:#fff;--ink:#16181d;--mut:#6a6e78;--line:rgba(22,24,29,.08);
--mon:#0b63e5;--onmon:#fff;--fern:#0b63e5;--sprout:#e4eeff;--bloom:#e5384f;--lf:20px;
--acc:var(--mon);--accs:color-mix(in srgb,var(--mon) 12%,var(--paper));--fld:color-mix(in srgb,var(--ink) 6%,var(--paper));
--fd:'SamsungOne','Samsung Sans',Roboto,'Google Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--fb:var(--fd);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--mist:#000;--paper:#1c1d21;--ink:#f1f2f4;--mut:#9a9ea8;--line:rgba(255,255,255,.1);--acc:color-mix(in srgb,var(--mon) 55%,#fff)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.5 var(--fb);background:var(--mist);color:var(--ink);padding-bottom:132px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:var(--ink)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--mon);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);font-weight:600;letter-spacing:-.01em;margin:0}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[data-ic]{display:inline-grid;place-items:center}

/* ---------- header (iOS style) ---------- */

.art{display:none}
.bar{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--paper);color:var(--ink);flex:none}

.hero h1 br{display:none}
.hero{--sf:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif;--tint:#007aff;font-family:var(--sf);position:relative;overflow:hidden;margin:0 0 12px;padding:calc(10px + env(safe-area-inset-top)) 16px 20px;border-radius:0 0 36px 36px;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--mon) 80%,#000) 0%,var(--mon) 52%,color-mix(in srgb,var(--bloom) 72%,var(--mon)) 135%);box-shadow:0 16px 36px -8px color-mix(in srgb,var(--mon) 45%,transparent),inset 0 -1px 0 rgba(255,255,255,.18)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:250px;height:250px;right:-80px;top:-70px;background:radial-gradient(circle,rgba(255,255,255,.3),rgba(255,255,255,0) 70%)}
.hero::after{width:180px;height:180px;left:-64px;bottom:-72px;border:2px dashed rgba(255,255,255,.3)}
.hero>*{position:relative;z-index:1}
@media(prefers-color-scheme:dark){.hero{--tint:#0a84ff}}
.hero .bar{gap:8px}
.hero .ib,.nb .ib{position:relative;width:40px;height:40px;font-size:19px;border-radius:50%;transition:transform .15s,opacity .15s}
.hero .ib{background:rgba(255,255,255,.2);color:#fff;border:.5px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.hero .ib:active,.nb .ib:active{transform:scale(.92);opacity:.6}
.hero .wab{background:rgba(52,199,89,.95);color:#fff;border-color:transparent}
.ib .bd{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;font:600 12px/1 var(--sf,inherit);background:#ff3b30;color:#fff;border-radius:10px;box-shadow:0 0 0 2px #fff}
.hero .gr{margin:20px 0 2px}
.gr b{display:block;font:600 13px/1.2 var(--sf);letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.gr b em{font-style:normal;background:linear-gradient(90deg,#ffe27a,#ffb36b);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1{font:700 34px/1.1 var(--sf);letter-spacing:.37px;margin:3px 0 4px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.18)}
.hero p{margin:0 0 14px;font:400 16px/1.35 var(--sf);color:rgba(255,255,255,.85)}
.hero .sr{flex-direction:row-reverse;height:40px;padding:0 12px 0 0;border-radius:12px;background:rgba(255,255,255,.22);border:.5px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.hero .sr input{font:400 17px var(--sf);color:#fff;caret-color:#ffd45e}
.hero .sr input::placeholder{color:rgba(255,255,255,.75)}
.hero .sr span{width:38px;height:40px;font-size:17px;color:rgba(255,255,255,.85)}
.hero .tg{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.16);border:.5px solid rgba(255,255,255,.32);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.tg span{font:400 15px/1.3 var(--sf);color:#fff}
.nb{position:fixed;top:0;left:0;right:0;z-index:39;display:flex;align-items:center;justify-content:center;min-height:44px;padding:env(safe-area-inset-top) 12px 0;background:color-mix(in srgb,var(--mist) 72%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 .5px 0 var(--line);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .2s;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
.nb.on{opacity:1;transform:none;pointer-events:auto}
.nb b{font:600 17px/44px -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;color:var(--ink);max-width:60%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nb .ib{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 2px);width:40px;height:40px;background:none;color:var(--tint,#007aff)}


.ob{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:6px 14px;border-radius:999px;background:var(--accs);color:var(--acc);font-size:13px;font-weight:600}
.ob i{width:8px;height:8px;border-radius:50%;background:#34c759}.ob i.off{background:var(--bloom)}.ob span{font-weight:400;opacity:.8}
.sr{display:flex;align-items:center;height:52px;padding:0 6px 0 20px;border-radius:999px;background:var(--fld)}
.sr input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.sr span{width:40px;height:40px;display:grid;place-items:center;color:var(--mut);font-size:20px}

/* ---------- banners ---------- */
.bnw{margin:14px 0 4px}
.bnt{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 4px;scrollbar-width:none}.bnt::-webkit-scrollbar{display:none}
.bnr{flex:none;width:calc(100% - 32px);height:176px;border-radius:28px;scroll-snap-align:center;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;text-align:left}
.bg0{background:linear-gradient(135deg,#0b63e5,#0a3fa0)}.bg1{background:linear-gradient(135deg,#2f80ed,#0b2f7a)}.bg2{background:linear-gradient(135deg,#4a90ff,#1257c9)}
.bnr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bnr::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(var(--oc,8,20,70),var(--od,.8)),rgba(var(--oc,8,20,70),0) 78%)}
.bnr:not(:has(img))::after{display:none}
.bnr>b,.bnr>small,.bnr>.bnb,.bnr>.bcd{position:relative;z-index:1}
.bnr b{font:600 22px/1.2 var(--fd);max-width:82%}
.bnr small{opacity:.92;margin-top:4px;max-width:82%;font-size:13px}
.bnr .bnb{align-self:flex-start;margin-top:12px;padding:8px 18px;border-radius:999px;background:#fff;color:#0b63e5;font-weight:600;font-size:13px}
.bnk{position:absolute;top:16px;left:16px;z-index:1;font-style:normal;font-weight:700;font-size:12px;letter-spacing:.05em;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.25)}
.bnk.ad{left:auto;right:16px;font-size:10.5px}
.bcd{align-self:flex-start;margin-top:8px;font-size:12px;padding:5px 10px;border:1.5px dashed currentColor;border-radius:12px}.bcd u{text-decoration:none;font-weight:700;letter-spacing:.08em}
.bnd{display:flex;justify-content:center;gap:6px;margin:10px 0 0}
.bnd i{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--ink) 20%,transparent);transition:.25s}.bnd i.on{width:20px;border-radius:4px;background:var(--mon)}
.note{background:var(--accs);color:var(--acc);font-weight:600;font-size:13.5px;text-align:center;border-radius:999px;margin:8px 16px;padding:10px 16px}
.demo{background:var(--bloom);color:#fff;font-size:13px;text-align:center;border-radius:999px;margin:8px 16px;padding:8px 14px}

/* ---------- chips + categories ---------- */
.rail{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 4px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
#rail{gap:14px}
.chip{flex:none;padding:10px 18px;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.chip.on{background:var(--mon);color:var(--onmon)}
.ct-i{width:60px;height:60px;border-radius:22px;overflow:hidden;display:grid;place-items:center;background:var(--paper);color:var(--acc);font-size:26px}
.ct-i img{width:100%;height:100%;object-fit:cover}
.rail .ct{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;font-size:12.5px}
.rail .ct b{max-width:68px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.rail .ct.on{color:var(--acc)}.rail .ct.on .ct-i{outline:2.5px solid var(--mon);outline-offset:2px}

/* ---------- sections ---------- */
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:22px 24px 8px}
.sh h2{font-size:22px;font-weight:600}.sh small{color:var(--mut)}
.sec{margin:6px 0}
.sl-r{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}.sl-r::-webkit-scrollbar{display:none}
.sl{flex:none;width:150px;text-align:left;scroll-snap-align:start}
.sl-i{position:relative;width:150px;height:118px;border-radius:26px;overflow:hidden;background:var(--fld)}
.sl-i img{width:100%;height:100%;object-fit:cover;display:block}
.sl-a{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:var(--mon);color:#fff;display:grid;place-items:center;font:600 20px/1 var(--fb)}
.sl b{display:block;margin-top:8px;font:600 14px var(--fd);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sl small{color:var(--acc);font-weight:600;font-size:13px}

/* ---------- dish list (one grouped surface) ---------- */
.g{display:flex;flex-direction:column;gap:3px;padding:6px 16px 28px}
.cw{cursor:pointer;transition:transform .15s}.cw:active{transform:scale(.985)}
.c{display:flex;flex-direction:row;align-items:center;gap:14px;padding:12px 14px 12px 12px;background:var(--paper);border-radius:10px}
.cw:first-child .c{border-radius:28px 28px 10px 10px}
.cw:last-child .c{border-radius:10px 10px 28px 28px}
.cw:only-child .c{border-radius:28px}
.imw{order:-1;position:relative;width:92px;flex:none}
.im{width:92px;height:92px;border-radius:24px;overflow:hidden;background:var(--fld)}
.im img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}.im img.ok{opacity:1}
.qa{position:absolute;right:-6px;bottom:-6px;width:32px;height:32px;border-radius:50%;background:var(--mon);color:#fff;font-size:20px;font-weight:600;line-height:1;display:grid;place-items:center;box-shadow:0 0 0 4px var(--paper);transition:transform .2s}.qa:active{transform:scale(.85)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.c .cc{color:var(--acc);font-size:12px;font-weight:500}
.c h3{font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd{margin:2px 0;color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{display:flex;align-items:center;flex-wrap:wrap;gap:6px;color:var(--mut);font-size:12.5px}.mt:empty{display:none}
.dt{width:3px;height:3px;border-radius:50%;background:var(--mut)}
.rt{display:inline-flex;align-items:center;gap:3px;color:var(--ink);font-weight:600}.rt .i{fill:#f5b301;stroke:#d89a00}.rt small{font-weight:400;color:var(--mut)}
.pr{margin-top:6px;font:600 16px var(--fb);color:var(--acc)}.pr small{font:400 12px var(--fb);color:var(--mut)}
.cw.o .im{filter:grayscale(1);opacity:.55}.cw.o .pr{color:var(--mut)}
.emp{text-align:center;color:var(--mut);padding:40px 24px}
.emp div{width:92px;height:92px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:var(--acc);background:var(--accs)}
.emp .go{margin-top:18px}
.mo{text-align:center;padding:0 0 20px}
footer{text-align:center;color:var(--mut);padding:10px 20px 20px;font-size:13px}
.skl{height:104px;border-radius:24px;background:linear-gradient(90deg,var(--paper) 25%,var(--fld) 50%,var(--paper) 75%);background-size:200% 100%;animation:shm 1.2s infinite}@keyframes shm{to{background-position:-200% 0}}
@media(min-width:760px){.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:960px;margin:0 auto}.cw .c,.cw:first-child .c,.cw:last-child .c{border-radius:26px}}

/* ---------- floating pill nav + mini bar ---------- */
.dock{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--paper);box-shadow:0 6px 28px rgba(0,0,0,.14);z-index:40}
.dock button{position:relative;flex:1;height:56px;border-radius:999px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;font-weight:500;transition:background .25s,color .25s}
.dock button i{font-style:normal;font-size:20px}
.dock button.on{background:var(--accs);color:var(--acc)}
.dock em{position:absolute;top:4px;right:calc(50% - 26px);background:var(--bloom);color:#fff;border-radius:99px;font-size:10.5px;font-weight:600;padding:1px 6px;font-style:normal}.dock em:empty{display:none}
.dock em.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.7)}}
.mini{position:fixed;left:16px;right:16px;max-width:440px;margin:auto;bottom:calc(92px + env(safe-area-inset-bottom));z-index:39;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;border-radius:999px;background:var(--mon);color:#fff;box-shadow:0 8px 24px rgba(11,99,229,.35);text-align:left;transition:opacity .25s}
.mini[hidden]{display:none!important}
.mini .mb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);font-size:20px}
.mini .mt{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:0;line-height:1.2;color:#fff;font-size:inherit}
.mini .mt b{font-size:14px}.mini .mt small{font-size:13px;font-weight:500;opacity:.9}
.mini .mgo{background:#fff;color:#0b63e5;font-weight:600;font-size:13px;padding:11px 18px;border-radius:999px}
.mini.pop{animation:minipop .5s}@keyframes minipop{40%{transform:scale(1.04) translateY(-4px)}}
body:has(.ov.on) .mini{opacity:0;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--mist);padding:11px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:90;pointer-events:none;max-width:90%;text-align:center;font-weight:500}
#toast.on{opacity:1;transform:translate(-50%,0)}
body:has(#mini:not([hidden])) #toast{bottom:calc(160px + env(safe-area-inset-bottom))}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:50;visibility:hidden;background:#0000;transition:background .3s,visibility 0s .45s}
.ov.on{visibility:visible;background:rgba(0,0,0,.42);transition:background .3s}
.ov .pn{position:absolute;background:var(--mist);color:var(--ink);overflow:auto;transition:transform .45s cubic-bezier(.2,.85,.25,1)}
.ov.on .pn{transform:none}
.bs .pn{left:0;right:0;bottom:0;margin:auto;max-width:560px;max-height:92vh;max-height:92dvh;border-radius:36px 36px 0 0;transform:translateY(104%)}
.ld .pn{top:0;bottom:0;left:0;width:min(340px,86vw);border-radius:0 32px 32px 0;transform:translateX(-104%)}
.fs .pn{inset:0;transform:translateY(100%)}
#ck{z-index:60}#me{z-index:58}
.ph{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 18px 10px}
.ph h2{flex:1;font-size:24px}
.fs .ph{position:sticky;top:0;z-index:6;background:var(--mist)}
.pad{padding:0 16px 18px}
.pgc .pn{display:flex;flex-direction:column;overflow:hidden}
.pgc .bl{flex:1;overflow:auto;padding:14px 0 18px}

/* ---------- buttons + fields ---------- */
.go{display:block;width:100%;padding:15px;border-radius:999px;background:var(--mon);color:var(--onmon);font-weight:600;font-size:16px;margin-top:8px;text-align:center;transition:transform .15s}
.go:active{transform:scale(.97)}.go.ghost{background:var(--accs);color:var(--acc)}.go:disabled{opacity:.5}
.fl input,.fl textarea,.fx input{display:block;width:100%;padding:14px 16px;margin:6px 0;border-radius:18px;border:0;background:var(--fld);outline:none;resize:none}
.fl input:focus,.fl textarea:focus,.fx input:focus,.promo:focus-within,.cin input:focus{box-shadow:0 0 0 2px var(--mon)}
.fl input:disabled{opacity:.6}
.or{display:flex;align-items:center;gap:12px;margin:16px 0 4px;color:var(--mut);font-size:13px}.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.gb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;margin-top:10px;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:600;font-size:16px;box-shadow:0 0 0 1px var(--line);transition:transform .15s,opacity .15s}.gb:active{transform:scale(.97);opacity:.7}.gb:disabled{opacity:.5}.gb svg{width:20px;height:20px;flex:none}
.er{color:var(--bloom);font-weight:600;min-height:22px}
.cn{color:var(--mut);margin:6px 0 14px}
.seg{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:999px;margin:6px 0 12px}
.seg button{flex:1;padding:10px;border-radius:999px;font-weight:500}.seg button.on{background:var(--mon);color:var(--onmon)}
.seg.ty{margin:10px 0}

/* ---------- product detail (classic) ---------- */
.dtop{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.dtop b{font:600 17px var(--fd)}
.dtop .ib{width:42px;height:42px;border-radius:14px;font-size:18px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.fv{color:var(--mut)}.fv.on{color:var(--bloom)}.fv.on .i{fill:var(--bloom)}
.dhero{--cw:min(58vw,300px);position:relative;display:flex;align-items:flex-start;padding:10px 0 0 22px;overflow:hidden}
.dhero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 78% 40%,color-mix(in srgb,var(--mon) 16%,transparent),transparent 62%);pointer-events:none}
.dl{position:relative;z-index:1;flex:1;min-width:0;padding-right:6px}
.dl h2{font-size:24px;line-height:1.15;font-weight:700;margin:8px 0 6px}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;color:var(--mut);font-size:13px}.meta:empty{display:none}
.dk{display:block;color:var(--mut);font-size:13px;margin:16px 0 4px}
.dv{display:block;font:600 18px var(--fd)}
.big{font:700 24px var(--fd);color:var(--acc)}.big small{font:400 13px var(--fb);color:var(--mut)}
.dc{position:relative;flex:none;width:var(--cw);margin:6px calc(var(--cw)*-.2) 0 0}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:1;border-radius:50%;background:var(--fld);box-shadow:0 22px 40px -20px rgba(0,0,0,.45)}
.car::-webkit-scrollbar{display:none}
.car img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px;padding-right:20%}
.dots i{width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--ink) 20%,transparent);transition:.3s}.dots i.on{width:22px;border-radius:4px;background:var(--mon)}
.dpad{padding:6px 22px 8px}
.vg{margin:16px 0 4px}.vl{display:block;color:var(--mut);font-size:13px;font-weight:400;margin-bottom:8px}
.vg .chip{background:var(--paper);padding:10px 22px;box-shadow:0 2px 8px rgba(0,0,0,.05)}.vg .chip.on{background:var(--mon);color:var(--onmon)}.vg .chip small{opacity:.8;font-weight:400}

async function doAuth(mode){const e=$('#a_e'),raw=$('#a_p').value.trim(),isM=mode==='in'&&raw.includes('@'),ph=isM?'':normPh(raw),pw=$('#a_w').value,n=mode==='up'?$('#a_n').value.trim():'',a=mode==='up'?$('#a_a').value.trim():'',em=isM?raw.toLowerCase():'';e.textContent='';
 if(!DB){e.textContent=T.noDb;return}
 if(mode==='up'&&n.length<2){e.textContent=T.needName;return}
 if(isM){if(!MAILRE.test(em)){e.textContent=T.badEmail;return}}else if(ph.length<9||ph.length>15){e.textContent=T.needPhone;return}
 if(pw.length<4){e.textContent=T.needPass;return}
 if(mode==='up'&&em&&!MAILRE.test(em)){e.textContent=T.badEmail;return}
 if(mode==='up'&&a.length<5){e.textContent=T.needAddr;return}
 const go=$('#a_go');go.disabled=true;
 try{
  if(isM){const d=await byMail(em);if(!d){e.textContent=T.badLogin;go.disabled=false;return}const u=d.data(),p=d.id;if(u.h!==await sha(p+':'+pw)){e.textContent=T.badLogin;go.disabled=false;return}setUser({name:u.n,phone:p,addr:u.a||''})}
  else{const ref=DB.collection('users').doc(ph),s=await ref.get(),h=await sha(ph+':'+pw);
   if(mode==='in'){if(!s.exists||s.data().h!==h){e.textContent=T.badLogin;go.disabled=false;return}const u=s.data();setUser({name:u.n,phone:ph,addr:u.a||''})}
   else{if(s.exists){e.textContent=T.exists;go.disabled=false;return}if(em&&await byMail(em)){e.textContent=T.mailUsed;go.disabled=false;return}const doc={n,a,h,ts:Date.now()};if(em)doc.em=em;await saveUser(ref,doc,ph);setUser({name:n,phone:ph,addr:a})}}
  authDone()
 }catch(x){e.textContent=errTxt(x);go.disabled=false}}
function meMail(step,em){const b=$('#me_b');$('#me_t').textContent=T.account;
 const hd=(t,sub)=>`<div class="wel"><div class="wl">${ic('user',30)}</div><h2>${esc(t)}</h2></div><p class="cn">${esc(sub)}</p>`,bk=`<button type="button" class="gb" id="m_b">${esc(T.back)}</button>`;
 if(!step){
  b.innerHTML=hd(T.contEmail,T.loginSub)+`<div class="fl"><input id="m_e" type="email" inputmode="email" placeholder="${esc(T.emailPh)}" autocomplete="email" autocapitalize="off"></div><div class="er" id="m_r"></div><button class="go" id="m_go">${esc(T.contBtn)}</button>`+bk;
  $('#m_b').onclick=()=>meAuth('in');
  $('#m_go').onclick=async()=>{const r=$('#m_r'),v=$('#m_e').value.trim().toLowerCase();r.textContent='';
   if(!DB){r.textContent=T.noDb;return}if(!MAILRE.test(v)){r.textContent=T.badEmail;return}
   const go=$('#m_go');go.disabled=true;
   try{const d=await byMail(v);go.disabled=false;meMail(d?'in':'up',v)}catch(x){r.textContent=errTxt(x);go.disabled=false}};
  return}
 const up=step==='up';
 b.innerHTML=hd(up?T.mailNew:T.mailWelcome,up?T.mailNewSub:T.mailOldSub)+`<div class="fl"><input value="${esc(em)}" disabled>${up?`<input id="m_n" placeholder="${esc(T.name)}" autocomplete="name"><input id="m_p" type="tel" inputmode="tel" placeholder="${esc(T.phone)}" autocomplete="tel">`:''}<input id="m_w" type="password" placeholder="${esc(T.password)}" autocomplete="${up?'new-password':'current-password'}">${up?`<textarea id="m_a" rows="2" placeholder="${esc(T.addr)}"></textarea>`:''}</div><div class="er" id="m_r"></div><button class="go" id="m_go">${esc(up?T.signup:T.login)}</button>`+bk;
 $('#m_b').onclick=()=>meMail();
 $('#m_go').onclick=async()=>{const r=$('#m_r'),pw=$('#m_w').value;r.textContent='';
  if(pw.length<4){r.textContent=T.needPass;return}
  let n='',ph='',a='';
  if(up){n=$('#m_n').value.trim();ph=normPh($('#m_p').value);a=$('#m_a').value.trim();
   if(n.length<2){r.textContent=T.needName;return}if(ph.length<9||ph.length>15){r.textContent=T.needPhone;return}if(a.length<5){r.textContent=T.needAddr;return}}
  const go=$('#m_go');go.disabled=true;
  try{
   if(up){const ref=DB.collection('users').doc(ph),s=await ref.get();if(s.exists){r.textContent=T.exists;go.disabled=false;return}
    if(await byMail(em)){r.textContent=T.mailUsed;go.disabled=false;return}
    await saveUser(ref,{n,a,em,h:await sha(ph+':'+pw),ts:Date.now()},ph);setUser({name:n,phone:ph,addr:a})}
   else{const d=await byMail(em);if(!d){r.textContent=T.badLogin;go.disabled=false;return}const u=d.data();
    if(u.h!==await sha(d.id+':'+pw)){r.textContent=T.badLogin;go.disabled=false;return}setUser({name:u.n,phone:d.id,addr:u.a||''})}
   authDone()
  }catch(x){r.textContent=errTxt(x);go.disabled=false}}}
async function gHandle(gu,inMe){const em=(gu.email||'').toLowerCase();
 if(!em)throw{code:'no-email'};
 const d=await byMail(em);
 if(d){const u=d.data();setUser({name:u.n,phone:d.id,addr:u.a||''});try{AU.signOut()}catch(_){}authDone();return}
 if(!inMe)openMe();
 meFinish({em,uid:gu.uid,name:gu.displayName||''})}
async function gAuth(){const e=$('#a_e'),btn=$('#a_g');e.textContent='';
 if(!DB||!AU){e.textContent=T.noDb;return}
 if(!/^https?:$/.test(location.protocol)){e.textContent=T.gEnv;return}
 btn.disabled=true;const pv=new firebase.auth.GoogleAuthProvider();
 try{const r=await AU.signInWithPopup(pv);await gHandle(r.user,true);btn.disabled=false}
 catch(x){const c=x&&x.code;
  if(c==='auth/operation-not-supported-in-this-environment'||c==='auth/popup-blocked'){
   try{await AU.signInWithRedirect(pv);return}catch(y){btn.disabled=false;e.textContent=T.gEnv;return}}
  btn.disabled=false;if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
  e.textContent=c==='auth/operation-not-allowed'?T.gOff:c==='auth/unauthorized-domain'?T.gDomain:T.gFail+(c?' ['+String(c).slice(0,60)+']':'')}}

 $('#f_go').onclick=async()=>{const e=$('#f_e'),n=$('#f_n').value.trim(),ph=normPh($('#f_p').value),a=$('#f_a').value.trim();e.textContent='';
