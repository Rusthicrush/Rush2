<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12303a" id="tc">
<title>Admin - Medical Booking</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#12303a;--mut:#5d7680;--paper:#fbfdfc;--card:#fff;--line:#d7e5e2;--g:#0e8f6b;--g2:#0a6d53;--gl:#e1f5ee;--red:#d6403a;--rl:#fdeceb;--blue:#e6f1f7;--amb:#b7791f;--aml:#fdf3dc;--head:#12303a;--onhead:#fff;--onG:#fff}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Figtree',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.wrap.wide{max-width:1000px}
.wrap.pb{padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus,button:focus-visible{border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 22%,transparent)}
textarea{resize:vertical;min-height:84px}
label{display:block;font-weight:600;font-size:13.5px;margin:12px 0 5px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--g);color:var(--onG)}
.btn:hover{background:var(--g2)}
.btn.sec{background:var(--blue);color:var(--ink)}
.btn.red{background:var(--rl);color:var(--red)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pad{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.head{background:var(--head);color:var(--onhead);border-radius:0 0 22px 22px;padding:22px 18px 20px;position:relative;overflow:hidden}
.head .in{max-width:720px;margin:0 auto;position:relative;z-index:1;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rx{position:absolute;right:-6px;top:-30px;font-size:190px;font-weight:800;color:var(--onhead);opacity:.07;line-height:1;pointer-events:none;font-family:Georgia,serif}
.head h1{font-size:23px;font-weight:800;letter-spacing:-.3px;cursor:default;user-select:none}
.head p{opacity:.8;margin-top:2px;font-size:14px}
.head a{color:inherit;font-weight:600}
.uchip{border:0;background:rgba(255,255,255,.16);color:var(--onhead);border-radius:99px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;flex:0 0 auto}
.av{width:28px;height:28px;border-radius:50%;background:var(--g);color:var(--onG);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.av.big{width:62px;height:62px;font-size:26px}
.banner{border-radius:12px;padding:11px 14px;margin-bottom:14px;font-weight:600}
.banner.warn{background:var(--aml);color:#7a4f0c}
.banner.err{background:var(--rl);color:var(--red)}
h2{font-size:17px;font-weight:800;margin-bottom:4px}
.sub{color:var(--mut);font-size:13.5px}
.steps{display:flex;gap:6px;margin:16px 0 14px}
.stp{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--mut)}
.stp i{display:block;height:30px;line-height:30px;border-radius:99px;font-style:normal;font-size:14px;background:var(--blue);margin-bottom:3px}
.stp.cur i{background:linear-gradient(90deg,var(--g) 50%,var(--gl) 50%);color:var(--onG);text-shadow:0 0 2px rgba(0,0,0,.25)}
.stp.cur{color:var(--ink)}
.stp.ok i{background:var(--g);color:var(--onG)}
.stp.ok{cursor:pointer;color:var(--ink)}
.docs{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-top:10px}
.doc{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;background:var(--card);text-align:left}
.doc b{display:block;font-size:16px}.doc span{font-size:13px;color:var(--mut)}
.doc:hover,.doc.on{border-color:var(--g);background:var(--gl)}
.days{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.day{border:1.5px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;background:var(--card)}
.day b{display:block;font-size:19px}.day span{display:block;font-size:13px;color:var(--mut)}.day em{display:block;margin-top:6px;font-style:normal;font-weight:700;font-size:13px;color:var(--g2)}
.day:hover{border-color:var(--g);background:var(--gl)}
.day.off{opacity:.5;cursor:not-allowed;background:var(--blue)}.day.off:hover{border-color:var(--line);background:var(--blue)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-top:10px}
.slot{border:1.5px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center;font-weight:700;background:var(--card);cursor:pointer}
.slot:hover{border-color:var(--g)}
.slot.on{background:var(--g);border-color:var(--g);color:var(--onG)}
.slot.full{background:var(--blue);color:var(--mut);opacity:.7;text-decoration:line-through;cursor:not-allowed}
.slot.full small{text-decoration:none}
.slot.blk{background:var(--rl);border-color:var(--red);color:var(--red)}
.slot small{display:block;font-size:11px;font-weight:600;opacity:.85}
.empty{color:var(--mut);padding:14px;text-align:center;background:var(--blue);border-radius:12px;margin-top:8px}
.tok{font-size:54px;font-weight:800;color:var(--g);line-height:1}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.tag.pending{background:var(--aml);color:var(--amb)}.tag.confirmed{background:var(--blue);color:var(--ink)}
.tag.done{background:var(--gl);color:var(--g2)}.tag.cancelled{background:var(--rl);color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}
.tabs button{flex:0 0 auto;border:0;background:var(--blue);padding:9px 15px;border-radius:99px;font-weight:700;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--head);color:var(--onhead)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat div{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.bk{border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;background:var(--card)}
.bk .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.bk .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.bk a{color:var(--g2);font-weight:600;text-decoration:none}
.kv{display:grid;grid-template-columns:100px 1fr;gap:2px 10px;font-size:14px;margin-top:6px}.kv span{color:var(--mut)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;margin:6px 0}
.sw input{width:20px;height:20px;accent-color:var(--g)}
.sm2{cursor:pointer;font-weight:800;font-size:17px}details>summary+*{margin-top:10px}
.shc{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;background:var(--card)}.shc.off{opacity:.65;background:var(--blue)}.shh{display:flex;justify-content:space-between;align-items:center}
.dchips{display:flex;gap:6px;flex-wrap:wrap}.dchips button{flex:1;min-width:44px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 0;font-weight:700;cursor:pointer}.dchips button.on{background:var(--g);border-color:var(--g);color:var(--onG)}
.wk{display:grid;grid-template-columns:110px 1fr 1fr;gap:6px;align-items:center;margin-top:6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.seg{display:flex;background:var(--blue);border-radius:12px;padding:4px;gap:4px;margin-top:8px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--g);color:var(--onG)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-radius:16px;padding:18px;margin-bottom:14px;border:1.5px solid}
.hero.ok{background:var(--gl);border-color:var(--g)}.hero.no{background:var(--rl);border-color:var(--red)}
.hero h2{font-size:20px;margin:0}.hero p{font-size:14px;margin-top:2px}
.ov{display:grid;grid-template-columns:1.3fr 1fr 70px;gap:4px 10px;font-size:14px;align-items:center}
.ov .h{color:var(--mut);font-size:12.5px;font-weight:700;padding-bottom:4px;border-bottom:1.5px solid var(--line)}
.ov .c{padding:7px 0;border-bottom:1px solid var(--line)}
.sect{font-size:12.5px;font-weight:800;color:var(--mut);margin:18px 0 8px;letter-spacing:.2px}
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:50}
.bnav button{flex:1;border:0;background:none;padding:8px;font-weight:700;color:var(--mut);cursor:pointer;border-radius:12px}
.bnav button.on{color:var(--g2);background:var(--gl)}
.bnav button span{display:block;font-size:20px;line-height:1.1}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.mini div{flex:1;min-width:70px;background:var(--blue);border-radius:10px;padding:8px;text-align:center}.mini b{display:block;font-size:18px}.mini small{color:var(--mut);font-size:12px}
.sum{background:var(--gl);border-radius:12px;padding:12px 14px;margin-top:8px}
.sum div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.sum a{color:var(--g2);font-weight:700;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--onhead);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw}
#toast.show{opacity:1}
.foot{text-align:center;color:var(--mut);font-size:12.5px;padding:18px}
@media(max-width:520px){.stat{grid-template-columns:repeat(2,1fr)}.ov{grid-template-columns:1.2fr 1fr 58px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.chat{margin-top:10px;border-radius:16px;background:var(--blue);padding:10px}.cmsgs{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.cm{max-width:82%;padding:8px 12px;border-radius:16px;font-size:14px;display:flex;flex-direction:column;word-break:break-word}.cm small{font-size:10.5px;opacity:.65;margin-top:2px}
.cm.me{align-self:flex-end;background:var(--g);color:var(--onG);border-bottom-right-radius:5px}.cm.ad{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px}
.crow{display:flex;gap:8px;margin-top:8px}.crow input{flex:1}.bdg{background:var(--red);color:#fff;border-radius:99px;font-style:normal;font-size:11px;padding:1px 7px;margin-left:4px}
/* professional booking look */
.head{border-radius:0 0 26px 26px;padding:26px 18px 24px;background:linear-gradient(135deg,var(--head),color-mix(in srgb,var(--head) 70%,var(--g)))}
.head h1{font-size:22px}.head p{font-size:13.5px;letter-spacing:.2px}
.pad{box-shadow:0 1px 2px rgba(18,48,58,.05),0 8px 24px -12px rgba(18,48,58,.15);border-color:transparent}
.pad h2{font-size:18px}
.stp i{height:32px;line-height:32px;box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}
.stp.ok i{box-shadow:none}.stp.cur i{box-shadow:none}
.doc{display:flex;flex-direction:column;gap:2px;padding:15px;transition:.15s}
.doc:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(18,48,58,.3)}
.doc b::before{content:'⚕';display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--gl);color:var(--g2);align-items:center;justify-content:center;margin-right:9px;font-size:15px}
.day{padding:20px 12px}.slot{padding:11px 4px}
.seg button small{font-size:11px}
.seg{padding:4px}.seg button.on{box-shadow:0 2px 8px -2px rgba(0,0,0,.3)}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12.5px;margin:14px 0}.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.tok{background:var(--gl);display:inline-block;padding:10px 22px;border-radius:14px;margin:6px 0}
.btn{transition:.15s}.btn:active{transform:scale(.98)}
@media(max-width:520px){.stat{grid-template-columns:repeat(2,1fr)}.ov{grid-template-columns:1.2fr 1fr 58px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== App style (Practo-like) ===== */
body{background:color-mix(in srgb,var(--paper) 93%,var(--g))}
.head{border-radius:0 0 30px 30px;padding:22px 18px 52px}
.head h1{font-size:21px}.head p{font-size:13px}
.wrap{position:relative;margin-top:-34px}
.wrap.pb{padding-bottom:112px}
.pad,.bk,.stat div,.hero{border:0!important;border-radius:22px;box-shadow:0 2px 12px rgba(15,40,60,.08)}
.steps{background:var(--card);border-radius:20px;padding:12px 8px 8px;box-shadow:0 6px 20px -8px rgba(15,40,60,.25);margin-top:0}
.stp i{width:30px;height:30px;line-height:30px;margin:0 auto 4px;border-radius:50%;background:var(--blue);box-shadow:none}
.stp.cur i{background:var(--g);color:var(--onG);text-shadow:none}.stp.ok i{background:var(--g2)}
.docs{grid-template-columns:1fr;gap:12px}
.doc{display:grid;grid-template-columns:54px 1fr 22px;column-gap:14px;align-items:center;border:0;border-radius:22px;padding:16px;box-shadow:0 2px 12px rgba(15,40,60,.09)}
.doc::before{content:'⚕';grid-row:1/3;width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--g),var(--g2));color:var(--onG);display:flex;align-items:center;justify-content:center;font-size:24px}
.doc::after{content:'›';grid-row:1/3;grid-column:3;font-size:28px;color:var(--mut)}
.doc b{grid-column:2;font-size:16.5px}.doc b::before{content:none!important;display:none}.doc span{grid-column:2}
.doc:hover,.doc.on{background:var(--gl)}
.days{gap:12px}
.day{border:0;border-radius:22px;padding:22px 12px;box-shadow:0 2px 12px rgba(15,40,60,.09)}

.day.off em{background:transparent}
.slots{grid-template-columns:repeat(3,1fr);gap:10px}
.slot{border:0;border-radius:99px;padding:13px 4px;box-shadow:0 1px 4px rgba(15,40,60,.14)}
.slot.on{box-shadow:0 6px 14px -4px color-mix(in srgb,var(--g) 70%,transparent)}
.seg{background:var(--card);border-radius:20px;box-shadow:0 2px 12px rgba(15,40,60,.08);padding:5px}
.seg button{border-radius:16px;padding:11px 6px}
.btn{border-radius:16px;padding:14px 18px}
input,select,textarea{border-radius:14px;padding:13px 14px}

.bnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 6px;border-radius:20px;font-weight:700;font-size:12px;color:var(--mut);cursor:pointer}
.bnav button span{font-size:20px;line-height:1.2}
.bnav button.on{background:var(--gl);color:var(--g2)}

.crow{display:flex;gap:8px;margin-top:8px}.crow input{flex:1}.bdg{background:var(--red);color:#fff;border-radius:99px;font-style:normal;font-size:11px;padding:1px 7px;margin-left:4px}

/* ===== Premium polish ===== */
:root{--sh1:0 1px 2px rgba(10,30,45,.06),0 8px 28px -10px rgba(10,30,45,.18);--sh2:0 2px 4px rgba(10,30,45,.08),0 18px 40px -14px rgba(10,30,45,.3);--grad:linear-gradient(135deg,var(--g),var(--g2))}
body{letter-spacing:.1px;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--g) 14%,transparent),transparent 70%),color-mix(in srgb,var(--paper) 94%,var(--g))}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#app .wrap>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#app .wrap>*:nth-child(2){animation-delay:.05s}#app .wrap>*:nth-child(3){animation-delay:.1s}
@media(prefers-reduced-motion:reduce){#app .wrap>*{animation:none}}
.head{background:radial-gradient(500px 220px at 90% -40px,rgba(255,255,255,.22),transparent 70%),radial-gradient(380px 200px at -10% 120%,color-mix(in srgb,var(--g) 60%,transparent),transparent 70%),var(--head);padding:26px 20px 60px;box-shadow:0 18px 40px -22px rgba(10,30,45,.6)}
.head h1{font-size:23px;font-weight:800;letter-spacing:-.5px}
.head p{opacity:.78;letter-spacing:.2px}
.uchip{background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22)}
.pad,.bk,.hero,.stat div{border:1px solid color-mix(in srgb,var(--line) 55%,transparent)!important;box-shadow:var(--sh1);border-radius:24px}
.pad{padding:22px 20px}
h2{font-size:20px;letter-spacing:-.4px;margin-bottom:6px}
.sub{font-size:13.5px;line-height:1.5}
label{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin:16px 0 6px}
.steps{border:1px solid color-mix(in srgb,var(--line) 55%,transparent);box-shadow:var(--sh2);padding:14px 8px 10px;border-radius:22px}
.stp{font-size:11.5px;letter-spacing:.3px}
.stp i{width:32px;height:32px;line-height:32px;font-weight:800;transition:.3s}
.stp.cur i{background:var(--grad);box-shadow:0 0 0 5px color-mix(in srgb,var(--g) 18%,transparent),0 6px 14px -4px color-mix(in srgb,var(--g) 70%,transparent)}
.stp.ok i{background:var(--g2)}
.doc{border:1px solid color-mix(in srgb,var(--line) 55%,transparent);box-shadow:var(--sh1);transition:transform .25s,box-shadow .25s,border-color .25s;padding:18px 16px}
.doc:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--g) 40%,transparent)}
.doc:active{transform:scale(.985)}
.doc::before{background:var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -6px color-mix(in srgb,var(--g) 65%,transparent);border-radius:20px;width:56px;height:56px}
.doc b{font-size:17px;letter-spacing:-.2px}
.doc span{display:inline-block;margin-top:3px;background:var(--gl);color:var(--g2);padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;justify-self:start}
.doc::after{content:'›';width:30px;height:30px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;color:var(--ink)}
.day{border:1px solid color-mix(in srgb,var(--line) 55%,transparent);box-shadow:var(--sh1);transition:.25s;position:relative;overflow:hidden}
.day::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
.day.off::before{background:var(--line)}
.day:not(.off):hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.day b{font-size:21px;letter-spacing:-.4px}
.slot{font-size:14.5px;letter-spacing:.2px;transition:.2s;border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.slot:hover:not(.full){transform:translateY(-2px);border-color:var(--g)}
.slot.on{background:var(--grad);border-color:transparent}
.slot.on::after{content:' ✓'}

/* ===== Rush UI/UX + motion upgrade v2 ===== */
:root{
 --motion-fast:180ms;--motion-mid:320ms;--motion-slow:620ms;
 --ease-out:cubic-bezier(.16,1,.3,1);
 --focus-ring:0 0 0 4px color-mix(in srgb,var(--g) 22%,transparent);
}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{overflow-x:hidden}
button,a,.doc,.day,.slot,.pad,.bk,.stat div,.hero,.steps,.seg,.uchip,.bnav{
 -webkit-tap-highlight-color:transparent;
}
button{touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--g) 65%,white);outline-offset:3px}
.pad,.bk,.hero,.stat div,.steps,.doc,.day,.slot,.seg,.bnav,.uchip{
 transition:transform var(--motion-mid) var(--ease-out),box-shadow var(--motion-mid) var(--ease-out),background-color var(--motion-fast),border-color var(--motion-fast),opacity var(--motion-mid);
}
@keyframes pageEnter{0%{opacity:0;transform:translateY(18px) scale(.985);filter:blur(3px)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes softPop{0%{opacity:0;transform:scale(.88)}70%{transform:scale(1.035)}100%{opacity:1;transform:scale(1)}}
@keyframes glowBreathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--g) 0%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--g) 10%,transparent)}}
@keyframes shimmer{0%{background-position:180% 0}100%{background-position:-180% 0}}
@keyframes checkBounce{0%{transform:scale(.7);opacity:.5}65%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
#app .wrap>*{animation:pageEnter .55s var(--ease-out) both}
#app .wrap>*:nth-child(2){animation-delay:55ms}
#app .wrap>*:nth-child(3){animation-delay:100ms}
#app .wrap>*:nth-child(4){animation-delay:145ms}
#app .wrap>*:nth-child(5){animation-delay:190ms}
.head{isolation:isolate}
.head:after{content:"";position:absolute;z-index:0;width:210px;height:210px;right:-80px;bottom:-135px;border:1px solid rgba(255,255,255,.18);border-radius:50%;box-shadow:0 0 0 22px rgba(255,255,255,.035),0 0 0 48px rgba(255,255,255,.025);pointer-events:none}
.rx{animation:softPop .9s var(--ease-out) both}
.doc:hover,.day:not(.off):hover,.bk:hover,.stat div:hover{transform:translateY(-3px)}
.doc.on{outline:2px solid color-mix(in srgb,var(--g) 45%,transparent);outline-offset:1px}
.doc.on::after{content:'✓';background:var(--g);color:var(--onG);font-size:17px;font-weight:900}
.day:not(.off):active,.doc:active,.slot:active,.bnav button:active{transform:scale(.97)}
.stp.cur i{animation:softPop .42s var(--ease-out) both}
.stp.ok i{animation:checkBounce .36s var(--ease-out) both}
.slot.on{animation:checkBounce .26s var(--ease-out) both}
.btn{position:relative;overflow:hidden;isolation:isolate}
.btn:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.18) 45%,transparent 70%);background-size:220% 100%;opacity:0;pointer-events:none}
.btn:hover:before{opacity:1;animation:shimmer .9s linear}
.btn:focus-visible{box-shadow:var(--focus-ring)}
input:focus,select:focus,textarea:focus{box-shadow:var(--focus-ring)}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--mut) 78%,transparent)}
label{line-height:1.35}
.bnav button span{transition:transform var(--motion-mid) var(--ease-out)}
.bnav button.on span{transform:translateY(-2px) scale(1.08)}
.tok{animation:softPop .5s var(--ease-out) both}
.banner{animation:pageEnter .4s var(--ease-out) both}
.empty{border:1px dashed color-mix(in srgb,var(--g) 25%,var(--line));}
.chat{animation:pageEnter .3s var(--ease-out) both}

const ALL7=()=>[true,true,true,true,true,true,true];
function ensureShifts(d){const ds=Object.values(d.days);
  if(!d.m){const w=ds.find(x=>x.on)||{},nw=ds.find(x=>x.non)||{};d.m={on:ds.some(x=>x.on),start:w.start||'09:00',end:w.end||'13:00'};d.n={on:ds.some(x=>x.non),start:nw.nstart||'18:00',end:nw.nend||'21:00'}}
  if(!d.m.gap)d.m.gap=d.slotMin||15;if(!d.n.gap)d.n.gap=d.slotMin||15;
  if(!d.m.wd)d.m.wd=d.wd||[0,1,2,3,4,5,6].map(i=>!!(d.days[i]&&d.days[i].on));
  if(!d.n.wd)d.n.wd=d.wd||[0,1,2,3,4,5,6].map(i=>!!(d.days[i]&&d.days[i].non))}
function syncDays(d){if(d.lab)return;for(let i=0;i<7;i++){const w=d.days[i];w.on=!!(d.m.wd[i]&&d.m.on);w.start=d.m.start;w.end=d.m.end;w.gap=d.m.gap;w.ngap=d.n.gap;w.non=!!(d.n.wd[i]&&d.n.on);w.nstart=d.n.start;w.nend=d.n.end}}
function targets(id){return id==='all'?S.doctors.filter(d=>!d.lab):[getDoc(id)].filter(Boolean)}
function setShift(id,k,f,v,re){const T=targets(id);if(!T.length)return;T.forEach(ensureShifts);if(f==='end'&&v<=T[0][k].start)return toast('End time must be after start');T.forEach(d=>{d[k][f]=v;syncDays(d)});saveSoon();if(re)render()}
function togDay(id,k,i){const T=targets(id);if(!T.length)return;T.forEach(ensureShifts);const nv=!T[0][k].wd[i];T.forEach(d=>{d[k].wd[i]=nv;syncDays(d)});saveSoon();render()}

  }else toast('Image or PDF only');
}

/* ================= WhatsApp-style inbox core (shared) ================= */
const WAD={};
const waKey=b=>(b.userId&&!String(b.userId).startsWith('guest-'))?String(b.userId):'ph:'+String(b.phone||'').replace(/\D/g,'');
function waItems(g){
  const it=[];
  g.bs.forEach(b=>{
    (b.chat||[]).forEach((m,i)=>it.push({k:'m',m,b,i,at:m.at||0}));
    (b.reports||[]).forEach((r,i)=>it.push({k:'r',r,b,i,at:r.at||0}));
  });
  return it.sort((a,b)=>a.at-b.at);
}
function waGroups(list){
  const m={};
  list.forEach(b=>{const k=waKey(b);(m[k]=m[k]||{key:k,bs:[]}).bs.push(b)});
  return Object.values(m).map(g=>{
    g.bs.sort((a,b)=>(a.created||0)-(b.created||0));
    g.items=waItems(g);g.last=g.items[g.items.length-1]||null;g.latest=g.bs[g.bs.length-1];
    g.at=g.last?g.last.at:(g.latest.created||0);return g;
  }).sort((a,b)=>b.at-a.at);
}
const waUnread=(g,side)=>g.bs.reduce((n,b)=>side==='a'
  ?n+(b.chat||[]).slice(b.chatSeenA||0).filter(m=>m.f==='u'&&!m.d).length
  :n+(b.chat||[]).slice(b.chatSeenU||0).filter(m=>m.f==='a'&&!m.d).length+(b.reports||[]).slice(b.reportSeenU||0).filter(r=>!r.d).length,0);
const waSame=(a,b)=>a.toDateString()===b.toDateString();
function waListTime(ts){
  if(!ts)return'';const d=new Date(ts),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);
  if(waSame(d,n))return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(waSame(d,y))return'Yesterday';
  return d.toLocaleDateString([],{day:'numeric',month:'short',year:'2-digit'});
}
function waDay(ts){
  const d=new Date(ts),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);
  if(waSame(d,n))return'Today';if(waSame(d,y))return'Yesterday';
  return d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function waTick(it,side){
  if(it.k==='m'?it.m.d:it.r.d)return'';
  let mine=false,rd=false;
  if(it.k==='m'){mine=it.m.f===side;rd=side==='a'?it.i<(it.b.chatSeenU||0):it.i<(it.b.chatSeenA||0)}
  else if(side==='a'){mine=true;rd=it.i<(it.b.reportSeenU||0)}
  return mine?`<i class="w2t${rd?' rd':''}">${rd?'✓✓':'✓'}</i>`:'';
}
function waBubble(it,side,tail){
  const tm=new Date(it.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const own=it.k==='m'?it.m.f===side:side==='a',dead=it.k==='m'?it.m.d:it.r.d;
  if(dead)return`<div class="w2b ${own?'me':'ot'}${tail?' tl':''}"><span class="w2tx w2dl">🚫 ${own?'You deleted this message':'This message was deleted'}</span><span class="w2m">${tm}</span></div>`;
  const xb=own?`<button class="w2x" title="Delete for everyone" onclick="waDel('${it.b.id}','${it.k}',${it.i})">⌄</button>`:'';
  if(it.k==='m'){
    const me=it.m.f===side;
    return`<div class="w2b ${me?'me':'ot'}${tail?' tl':''}">${xb}<span class="w2tx">${esc(it.m.t)}</span><span class="w2m">${tm}${waTick(it,side)}</span></div>`;
  }
  const r=it.r,me=side==='a';let a='';
  if(r.file&&String(r.file).startsWith('data:')){
    a=r.ft==='application/pdf'
      ?`<a class="w2pdf" href="${esc(r.file)}" download="${esc(r.fn||'report.pdf')}"><b>PDF</b><span>${esc(r.fn||'report.pdf')}<small>Tap to download</small></span></a>`
      :`<a href="${esc(r.file)}" download="${esc(r.fn||'report.jpg')}"><img class="w2img" src="${esc(r.file)}" alt="report"></a>`;
  }
  return`<div class="w2b ${me?'me':'ot'}${tail?' tl':''}">${xb}${r.t?`<b class="w2rt">🧪 ${esc(r.t)}</b>`:''}${a}${r.m?`<span class="w2tx">${esc(r.m)}</span>`:''}<span class="w2m">${tm}${waTick(it,side)}</span></div>`;
}
function waDel(bid,k,i){
  const g=waGet(waCur());if(!g)return;const b=g.bs.find(x=>x.id===bid);if(!b)return;
  if(!confirm('Delete this message for everyone?'))return;
  if(k==='m'){const c=(b.chat||[]).map((m,j)=>j===i?{f:m.f,at:m.at,d:1}:m);b.chat=c;Promise.resolve(Store.updateBooking(b.id,{chat:c})).catch(()=>toast('Delete failed. Check connection.'))}
  else{const r=(b.reports||[]).map((x,j)=>j===i?{at:x.at,d:1}:x);b.reports=r;Promise.resolve(Store.updateBooking(b.id,{reports:r})).catch(()=>toast('Delete failed. Check connection.'))}
  waPaint();if(typeof waRowsPaint==='function')waRowsPaint();toast('Deleted for everyone');
}
function waMsgsHtml(g,side,empty){
  const items=waItems(g);
  if(!items.length)return`<div class="w2empty">${empty}</div>`;
  let h='',day='',prev='';
  items.forEach(it=>{
    const d=new Date(it.at).toDateString(),who=it.k==='r'?'a':it.m.f;
    if(d!==day){day=d;prev='';h+=`<div class="w2day"><span>${waDay(it.at)}</span></div>`}
    h+=waBubble(it,side,who!==prev);prev=who;
  });
  return h;
}
function waComposer(canSend,attach){
  const k=waCur();
  return`<div class="w2cmp">${attach?`<label class="w2clip" title="Attach report (photo / PDF)">📎<input type="file" accept="image/*,application/pdf" hidden onchange="waAttach(this)"></label>`:''}<input id="w2in" maxlength="500" autocomplete="off" placeholder="${canSend?'Type a message':'Chat unavailable'}" value="${esc(WAD[k]||'')}" oninput="WAD[waCur()]=this.value" onkeydown="if(event.key==='Enter')waSend()" ${canSend?'':'disabled'}><button class="w2snd" onclick="waSend()" aria-label="Send" ${canSend?'':'disabled'}>➤</button></div>`;
}
function waSeen(g){
  g.bs.forEach(b=>{
    const p={},n=(b.chat||[]).length,r=(b.reports||[]).length;
    if(WA_SIDE==='a'){if((b.chatSeenA||0)<n){p.chatSeenA=n;b.chatSeenA=n}}
    else{
      if((b.chatSeenU||0)<n){p.chatSeenU=n;b.chatSeenU=n}
      if((b.reportSeenU||0)<r){p.reportSeenU=r;b.reportSeenU=r}
    }
    if(Object.keys(p).length)Promise.resolve(Store.updateBooking(b.id,p)).catch(()=>{});
  });
}
function waPaint(force){
  const m=document.getElementById('w2msgs');if(!m)return;
  const g=waGet(waCur());if(!g)return;
  const near=force||m.scrollHeight-m.scrollTop-m.clientHeight<90;
  m.innerHTML=waMsgsHtml(g,WA_SIDE,WA_EMPTY(g));
  if(near)m.scrollTop=m.scrollHeight;
}
function waRefresh(){
  waPaint();
  if(typeof waRowsPaint==='function')waRowsPaint();
  const g=waGet(waCur());if(g&&!document.hidden)waSeen(g);
}
function refreshChat(){waRefresh()}
function waSend(){
  const k=waCur(),g=waGet(k),i=document.getElementById('w2in');if(!g||!i)return;
  const t=i.value.trim();if(!t)return;
  const b=g.latest;if(!b)return toast('Book an appointment first to chat with the clinic');
  const c=[...(b.chat||[]),{f:WA_SIDE,t,at:Date.now()}];
  if(JSON.stringify(c).length>800000)return toast('Chat is too large for this booking');
  b.chat=c;const p={chat:c};p[WA_SIDE==='a'?'chatSeenA':'chatSeenU']=c.length;
  WAD[k]='';i.value='';waPaint(true);if(typeof waRowsPaint==='function')waRowsPaint();
  Promise.resolve(Store.updateBooking(b.id,p)).catch(()=>toast('Failed to send. Check connection.'));
  i.focus();
}
const _render=render;
render=function(){
  const m0=document.getElementById('w2msgs'),k0=window._w2k||'';
  const near=!m0||m0.scrollHeight-m0.scrollTop-m0.clientHeight<90,st=m0?m0.scrollTop:0;
  _render();
  const m=document.getElementById('w2msgs'),k=waCur();
  if(m){if(near||k!==k0||!m0)m.scrollTop=m.scrollHeight;else m.scrollTop=st}
  window._w2k=m?k:'';
  const g=m&&waGet(k);if(g&&!document.hidden)waSeen(g);
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const g=waGet(waCur());if(g)waSeen(g)}});
window._ready=true;softRender();
</script>
</body>
