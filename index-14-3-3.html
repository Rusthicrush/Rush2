  const modern = () => {
    fields.forEach((fd, i) => { const el = $("#rf_" + i); if(!el || el.dataset.m) return; el.dataset.m = "1"; el.dataset.ico = fd.k === "grade" ? "gradesel" : (fd.k || "text");
      if(fd.k === "count" && fd.t === "number"){
        const w = document.createElement("div"); w.className = "stepper"; el.parentNode.insertBefore(w, el);
        w.innerHTML = '<button type="button" data-st="-1" aria-label="Fewer people">\u2212</button>'; w.appendChild(el);
        w.insertAdjacentHTML("beforeend", '<button type="button" data-st="1" aria-label="More people">+</button>');
        w.addEventListener("click", e => { const bt = e.target.closest("[data-st]"); if(!bt) return; const mn = +el.min || 1, mx = +el.max || 10;
          el.value = Math.min(mx, Math.max(mn, (parseInt(el.value, 10) || mn) + (+bt.dataset.st))); el.dispatchEvent(new Event("input", { bubbles: true })); });
      }
      if(fd.k !== "count") wrapFF(el, el.dataset.ico);
      if(el.tagName === "TEXTAREA") el.addEventListener("input", () => { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 220) + "px"; });
    });
    const sc = $("#rSchool"); if(sc && !sc.dataset.m){ sc.dataset.m = "1"; sc.dataset.ico = "grade"; wrapFF(sc, "grade"); }
    ["olPassed", "alSat"].forEach(id => { const sel = $("#" + id); if(!sel || sel.dataset.m) return; sel.dataset.m = "1";
      const opts = [...sel.options].filter(o => o.value); if(opts.length < 2 || opts.length > 4) return;
      const box = document.createElement("div"); box.className = "choice"; box.setAttribute("role", "radiogroup");
      box.innerHTML = opts.map(o => '<button type="button" role="radio" aria-checked="false" data-v="' + escE(o.value) + '">' + escE(o.textContent) + '</button>').join("");
      sel.classList.add("m-hide"); sel.insertAdjacentElement("afterend", box);
      box.addEventListener("click", e => { const bt = e.target.closest("[data-v]"); if(!bt) return; sel.value = bt.dataset.v;
        box.querySelectorAll("button").forEach(x => { const on = x === bt; x.classList.toggle("on", on); x.setAttribute("aria-checked", on); });
        sel.dispatchEvent(new Event("change", { bubbles: true })); sel.dispatchEvent(new Event("input", { bubbles: true })); });
    });
  };
  modern(); const olw = $("#olWrap"); if(olw) new MutationObserver(modern).observe(olw, { childList: true, subtree: true });

  /* ---------- step-by-step wizard ---------- */
  const bad = (sel, m) => { f.querySelectorAll(".fld-err").forEach(x => x.remove()); const el = $(sel);
    if(el && el.type !== "hidden" && el.offsetParent !== null){ err.textContent = ""; el.classList.add("invalid"); const d = document.createElement("div"); d.className = "fld-err"; d.setAttribute("role", "alert"); d.textContent = m; el.insertAdjacentElement("afterend", d); el.scrollIntoView({ behavior: "smooth", block: "center" }); try{ el.focus({ preventScroll: true }); }catch(_){ el.focus(); } }
    else { err.textContent = m; err.scrollIntoView({ behavior: "smooth", block: "center" }); } };
  const pageList = () => {
    const O = OLc(), g = gradeVal(), noG = g === null, L = ["p1"];
    if(f.querySelector('[data-pg="p2"]')) L.push("p2");
    if(olOn()){
      if(O.ask && (noG || g === "O/L" || g === "A/L")) L.push("ol");
      if(O.askAL && (noG || g === "A/L")) L.push("al");
    }
    return L;
  };
  let cur = "p1";
  const isLast = () => { const L = pageList(); return L.indexOf(cur) === L.length - 1 && !(cur === "p2" && gradeVal() === ""); };
  const show = (key, scroll) => {
    const L = pageList(); if(!L.includes(key)) key = L[L.length - 1];
    cur = key; const i = L.indexOf(key), last = isLast();
    f.querySelectorAll(".rw-pg").forEach(p => { p.hidden = p.dataset.pg !== key; });
    L.forEach((k, n) => { const el = f.querySelector('[data-pg="' + k + '"] .rw-n'); if(el) el.textContent = n + 1; });
    $("#rwBack").hidden = i === 0; $("#rwNext").hidden = last; $("#rwSubmit").hidden = !last;
    const fill = $("#regProgFill"), txt = $("#regProgTxt");
    if(fill) fill.style.width = Math.round((i + 1) / L.length * 100) + "%";
    if(txt) txt.textContent = "Step " + (i + 1) + " of " + L.length;
    err.textContent = ""; f.querySelectorAll(".fld-err").forEach(x => x.remove()); f.querySelectorAll(".invalid").forEach(x => x.classList.remove("invalid"));
    if(scroll) f.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  const fieldErr = (fd, i) => {
    let val = v("#rf_" + i); const sel = "#rf_" + i;
    if(fd.k === "grade"){
      if(fd.req && !v("#rSchool")) return { sel: "#rSchool", msg: "Please enter your school." };
      if(!val) return { sel, msg: "Please choose your grade." };
      return null;
    }
    if(fd.req && !val) return { sel, msg: "Please fill: " + fd.l };
    if(fd.k === "name" && val && val.length < 2) return { sel, msg: "Please enter your name." };
    if(fd.k === "phone"){ val = val.replace(/\s+/g, ""); if(val && !/^\+?\d{9,14}$/.test(val)) return { sel, msg: "Please enter a valid mobile number." }; }
    return null;
  };
  const check = key => {
    if(key === "p1"){ const evObj = S.events.find(e => e.t === v("#rEvent")); if(!evObj || !evOpen(evObj)) return { sel: "#rEvent", msg: "This event is no longer open for registration." }; }
    if(key === "p1" || key === "p2"){
      for(let i = 0; i < fields.length; i++){ if(pageOf(fields[i]) !== key) continue; const e = fieldErr(fields[i], i); if(e) return e; }
      return null;
    }
    const ex = collectOL(gradeVal());
    if(ex.err){ const isAL = /^#al/.test(ex.sel); if((key === "ol" && !isAL) || (key === "al" && isAL)) return { sel: ex.sel, msg: ex.err }; }
    return null;
  };
  $("#rwNext").addEventListener("click", () => { const e = check(cur); if(e) return bad(e.sel, e.msg); const L = pageList(), i = L.indexOf(cur); if(i < L.length - 1) show(L[i + 1], true); });
  $("#rwBack").addEventListener("click", () => { const L = pageList(), i = L.indexOf(cur); if(i > 0) show(L[i - 1], true); });
  f.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.tagName !== "TEXTAREA" && e.target.tagName !== "BUTTON"){ e.preventDefault(); if(isLast()) f.requestSubmit(); else $("#rwNext").click(); } });
  f.addEventListener("change", e => { if(gi >= 0 && e.target.id === "rf_" + gi) show(cur); });
  f.querySelectorAll("[data-pick]").forEach(c => {
    const choose = () => {
      f.querySelectorAll("[data-pick]").forEach(x => x.classList.toggle("sel", x === c));
      $("#rEvent").value = c.dataset.pick;
      curOL = olAsk(S.events.find(x => x.t === c.dataset.pick)); const ow = $("#olWrap"); if (ow) { ow.innerHTML = olBlockHTML(); bindOL(); }
      show(cur);
    };
    c.addEventListener("click", choose);
    c.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); e.stopPropagation(); choose(); } });
  });
  f.addEventListener("input", e => { e.target.classList.remove("invalid"); const n = e.target.nextElementSibling; if(n && n.classList.contains("fld-err")) n.remove(); });
  show("p1");

  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    if(!isLast()){ $("#rwNext").click(); return; }
    err.textContent = "";
    for(const key of pageList()){ const e = check(key); if(e){ show(key); return bad(e.sel, e.msg); } }
    const title = v("#rEvent"), evObj = S.events.find(e => e.t === title);
    if(!evObj || !evOpen(evObj)) return bad("#rEvent", "This event is no longer open for registration.");
    const std = { name: "", phone: "", grade: "", count: 1, note: "" }, answers = []; let school = "";
    fields.forEach((fd, i) => {
      let val = v("#rf_" + i);
      if(fd.k === "phone") val = val.replace(/\s+/g, "");
      if(fd.k === "count") val = Math.min(10, Math.max(1, parseInt(val, 10) || 1));
      if(fd.k === "grade") school = v("#rSchool");
      if(REG_STD.includes(fd.k)) std[fd.k] = val; else if(val !== "") answers.push({ l: fd.l, v: String(val) });
    });
    const name = std.name, phone = std.phone, grade = std.grade, count = std.count;
    const dup = (VX.LS.get("vx_myregs_cache", {}) || {});
    if(phone && Object.values(dup).some(x => x.event === title && x.phone === phone && x.status !== "cancelled")) return bad("#rEvent", "You are already registered for this event with this number.");
    curOL = olAsk(evObj); const ex = collectOL(gradeVal()); if(ex.err) return bad(ex.sel, ex.err);
    const r = { id: VX.uid("RG"), event: title, eventDate: evObj.d || "", name, phone, grade, school, count, note: std.note, answers, status: ex.decline ? "declined" : "pending", at: Date.now() };
    if(ex.ol) r.ol = ex.ol; if(ex.al) r.al = ex.al; if(ex.decline) r.declineReason = ex.decline;
    const btn = $("#rwSubmit"), btnLbl = btn.textContent; btn.disabled = true; btn.textContent = "Submitting…";
    try{ await VX.addRegistration(r); }catch(e){ btn.disabled = false; btn.textContent = btnLbl; return err.textContent = "Registration failed — please contact us. (" + (e.code || e.message) + ")"; }
    btn.disabled = false;
    const prof = VX.LS.get("vx_profile", {}) || {};
    VX.LS.set("vx_profile", Object.assign({}, prof, { name, phone, grade, school }));
    const ids = VX.LS.get("vx_myregs", []); ids.push(r.id); VX.LS.set("vx_myregs", ids);

  const ymd = o => { const d = new Date(); d.setDate(d.getDate() + o); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
  const mins = t => { const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(t); if(!m) return null; let h = +m[1] % 12; if(/PM/i.test(m[3])) h += 12; return h*60 + +m[2]; };
  const tb = () => [...document.querySelectorAll("#timeChips button")];

  const updateSummary = () => {
    const sm = $("#sumMain"), ss = $("#sumSub"), su = $("#sumUrg"), s3 = $("#step3Ind");
    if (sm) sm.textContent = sIn.value || "Service";
    if (ss) ss.textContent = `${dIn.value} · ${tIn.value || "No slot"}`;

    if (s3) s3.classList.toggle("active", !!hasContact);
  };

  const refresh = () => {
    const now = new Date(), nm = now.getHours()*60 + now.getMinutes(), isToday = dIn.value === ymd(0);
    tb().forEach(b => { const m = mins(b.dataset.time); b.disabled = isToday && m !== null && m <= nm; });
    const cur = tb().find(b => b.classList.contains("on"));
    if(!cur || cur.disabled){
      const nx = tb().find(b => !b.disabled);
      tb().forEach(b => b.classList.toggle("on", b === nx));
      tIn.value = nx ? nx.dataset.time : "";
    }
    const availCnt = tb().filter(b => !b.disabled).length;
    const stEl = $("#slotStatus");

    document.querySelectorAll("#dayChips button").forEach(b => b.classList.toggle("on", ymd(+b.dataset.day) === dIn.value));
    updateSummary();
  };

  f.addEventListener("click", e => {
    const urg = e.target.closest("[data-urg]");

      updateSummary(); return;
    }
    const d = e.target.closest("[data-day]");
    if (d) { dIn.value = ymd(+d.dataset.day); refresh(); return; }
    const t = e.target.closest("[data-time]");
    if (t && !t.disabled) { tIn.value = t.dataset.time; tb().forEach(b => b.classList.toggle("on", b === t)); updateSummary(); return; }
    const ar = e.target.closest("[data-area]");
    if (ar) {
      const aIn = $("#bAddr");
      if (aIn) {
        const cur = aIn.value.trim();

        if (on && ix < 0) parts.push(tag);
        if (!on && ix >= 0) parts.splice(ix, 1);
        nIn.value = parts.join(" · ");
      }
      return;
    }
  });

  dIn.addEventListener("change", refresh);
  refresh();
  f.addEventListener("input", e => { e.target.classList.remove("invalid"); updateSummary(); });

  f.addEventListener("submit", async ev => {
    ev.preventDefault();

    if(name.length < 2) return bad("#bName", "Please enter your name.");
    if(!/^\+?\d{9,14}$/.test(phone)) return bad("#bPhone", "Please enter a valid mobile number.");
    if(S.booking.requireAddress && addr.length < 3) return bad("#bAddr", "Please enter your grade / school.");
    if(!v("#bDate")) return bad("#bDate", "Please select a date.");
    if(v("#bDate") < $("#bDate").min || v("#bDate") > $("#bDate").max) return bad("#bDate", "Date must be between " + $("#bDate").min + " and " + $("#bDate").max + ".");
    if(!v("#bTime")) return err.textContent = "No time slots left for this day — please pick another date.";
    const b = {
      id:VX.uid("VX"), name, phone,
      service:v("#bService"), elec:v("#bElec"),
      date:v("#bDate"), time:v("#bTime"),
      addr, note:v("#bNote"), urg:bookUrgency,
      status:"pending", at:Date.now()
    };
    const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
    try{ await VX.addBooking(b); }catch(e){ btn.disabled = false; return err.textContent = "Booking failed — please call us. (" + (e.code || e.message) + ")"; }
    btn.disabled = false;
    VX.LS.set("vx_profile", {name, phone, addr});
    const ids = VX.LS.get("vx_mine", []); ids.push(b.id); VX.LS.set("vx_mine", ids);
    const cache = VX.LS.get("vx_mine_cache", {}); cache[b.id] = b; VX.LS.set("vx_mine_cache", cache);
    ticketHTML = `

          <div>

function collectOL(gr) {
  const O = OLc(), out = { ol: null, al: null, decline: "" }; if (!olOn()) return out;
  if (gr === undefined) gr = null;
  const noG = gr === null, olLevel = noG || gr === "O/L" || gr === "A/L", alLevel = noG || gr === "A/L";
  const val = s => ($(s) ? $(s).value.trim() : "");
  if (O.ask) {
    if (!olLevel) { if (O.passOnly) out.decline = O.notPassedMsg; }
    else {
      const passed = val("#olPassed");
      if (!passed) return { err: "Please tell us if you passed the O/L exam.", sel: "#olPassed" };
      out.ol = { passed, year: val("#olYear"), medium: val("#olMedium"), subjects: [] };
      if (passed !== "yes") { if (O.passOnly) out.decline = O.notPassedMsg; }
      else if (O.askResults) {
        const entries = [], marks = O.mode === "marks";
        for (const c of O.compulsory) {
          const g = val("#olg_" + c.k), sub = val("#olc_" + c.k);
          if ((c.opts || []).length && !sub) return { err: "Choose your " + c.l + " subject.", sel: "#olc_" + c.k };
          if (g === "") return { err: "Enter your " + c.l + (marks ? " marks." : " grade."), sel: "#olg_" + c.k };
          entries.push(mkOLEntry(c.k, c.l, sub || c.l, g, marks));
        }
        for (let i = 0; i < O.baskets.length; i++) {
          const sub = val("#olb_" + i), g = val("#olbg_" + i);
          if (!sub) continue;
          if (g === "") return { err: "Enter the " + (marks ? "marks" : "grade") + " for " + sub + ".", sel: "#olbg_" + i };
          entries.push(mkOLEntry("b" + i, O.baskets[i].l, sub, g, marks));
        }
        if (entries.some(x => x.bad)) { const b = entries.find(x => x.bad); return { err: "Marks must be between 0 and 100 (" + b.n + ").", sel: (/^b\d/.test(b.k) ? "#olbg_" + b.k.slice(1) : "#olg_" + b.k) }; }
        out.ol.subjects = entries.map(({ bad, ...rest }) => rest);
        const ev = VX.evalOL(O, out.ol.subjects);
        out.ol.ok = ev.ok; out.ol.count = ev.count; out.ol.line = ev.line; out.ol.verdict = ev.ok ? "Meets minimum (" + ev.count + " subjects at " + ev.line + " or better)" : ev.reasons.join("; ");
        if (!ev.ok && O.autoDecline) out.decline = O.declineMsg;
      }
    }
  }
  if (O.askAL && alLevel && (!O.ask || gr === "A/L" || (out.ol && out.ol.passed === "yes"))) {
    const sat = val("#alSat");
    if (!sat && O.alRequired) return { err: "Please tell us if you sat the A/L exam.", sel: "#alSat" };
    if (sat) {
      out.al = { sat, stream: "", subjects: [] };
      if (sat === "yes" && O.askALSub !== false) {
        const si = val("#alStream");
        if (si === "" && O.alRequired) return { err: "Please choose your A/L stream.", sel: "#alStream" };
        if (si !== "") {
          out.al.stream = O.alStreams[+si].l; out.al.results = [];
          for (let i = 0; i < 3; i++) {
            const sub = val("#alS" + i), g = val("#alG" + i);
            if (!sub) continue;
            if (!g) return { err: "Choose the A/L result for " + sub + ".", sel: "#alG" + i };
            out.al.results.push({ n: sub, g });
          }
          out.al.subjects = out.al.results.map(x => x.n + " (" + x.g + ")");
        }
      }
    }
  }
  return out;
}
function mkOLEntry(k, l, n, g, marks) {
  if (marks) { const m = Math.round(Number(g)); if (!(m >= 0 && m <= 100)) return { k, l, n, g: "", m: g, bad: true }; return { k, l, n, m, g: VX.gradeOfMarks(m) }; }
  return { k, l, n, g };
}
function olWaText(r) {
  let s = "";
  if (r.ol) {
    s += "\nO/L: " + ({ yes: "Passed", sitting: "Not yet / sitting soon", no: "Not passed" }[r.ol.passed] || r.ol.passed) + (r.ol.year ? " (" + r.ol.year + ")" : "");
    if ((r.ol.subjects || []).length) s += "\nResults: " + r.ol.subjects.map(x => (x.n || x.l) + " " + x.g).join(", ");
  }
  if (r.al) s += "\nA/L: " + alTxt(r.al);
  return s;
}
function olCardHTML(r) {
  let s = "";
  if (r.ol && (r.ol.subjects || []).length) s += `<small>O/L: ${r.ol.subjects.map(x => esc(x.n || x.l) + " " + esc(x.g)).join(" · ")}</small>`;
  if (r.al) s += `<small>A/L: ${esc(alTxt(r.al))}</small>`;
  if (r.status === "declined" && r.declineReason) s += `<small style="color:var(--red);font-weight:700;margin-top:4px">${esc(r.declineReason)}</small>`;
  return s;
}


/* ---------- INIT (settings + reviews live) ---------- */
let first = true;
VX.onSettings(s => {
  S = s; buildShell();
  if(first){
    first = false;
    const h = location.hash.replace("#", "");
    go(h || "home");
  } else if(!typing()){
    if(!tabs().some(t => t.id === view)) go("home"); else if(view !== "book") render();
  }
});
VX.onReviews(l => { R = l.filter(x => x.approved); if(!first && (view === "reviews" || view === "home") && !typing()) render(); });
VX.onRegistrations(l => {
  const ids=VX.LS.get("vx_myregs",[]); const mine=l.filter(r=>ids.includes(r.id));
  myRegs=mine.sort((a,b)=>(b.at||0)-(a.at||0));
  if(mine.length){ const cache={}; mine.forEach(r=>cache[r.id]=r); VX.LS.set("vx_myregs_cache",cache); }
  if(!first && view==="register" && !typing()) render();
});
VX.onChatMessages(l => { chatMessages=l; if(view==="register" && !refreshChatLog() && !first && !typing()) render(); }, getPublicChatId());
VX.onPosts(l => { PS = l; if(!first && ["posts","post","home"].includes(view) && !typing()) renderKeep(); });
VX.onLikes(l => { LK = l; refreshCounts(); });
VX.onComments(l => { CM = l; refreshCounts(); if(view === "post") refreshComments(); });
</script>

<script>
/* ===== MOTION LAYER JS ===== */
(function(){
  var RM = window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches;
  var host = document.getElementById("app") || document.getElementById("root"); if(!host) return;
  var SEL = ".hero,.hero-teacher,.stat,.card,.mini,.quick-item,.post-card,.xp,.xhero,.event-card,.service-card,.teacher-card,.review-card,.ticket,.sec-h,.row,.lock>*,.lock .li";
  var entering = true, io, safety, tmr;
  /* ---- welcome splash ---- */
  var W = document.createElement("div"); W.id = "welcome";
  var hr = new Date().getHours(), g = hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";
  W.innerHTML = '<div class="w-orb w-o1"></div><div class="w-orb w-o2"></div><div class="w-box"><div class="w-logo"><i class="w-ring"></i><i class="w-ring r2"></i><b class="w-lg"></b></div><div class="w-ar" dir="rtl" lang="ar">السلام عليكم</div><div class="w-hi">Welcome · '+g+'</div><div class="w-name"><span>Welcome</span></div><div class="w-tag"></div><div class="w-bar"><i></i></div></div><div class="w-pw"><small>Powered by</small><b>Rush Environment</b></div>';
  if(!RM && !document.body.classList.contains("noanim")) document.body.insertBefore(W, document.body.firstChild); else W = null;
  function fillBrand(){
    if(!W) return;
    var b = document.querySelector("#brand"), lg = W.querySelector(".w-lg");
    if(b){
      var im = b.querySelector("img,.lg svg,svg"), t = b.querySelector(".brand-title"), s = b.querySelector(".brand-sub");
      if(im && !lg.firstChild) lg.appendChild(im.cloneNode(true));
      if(t) W.querySelector(".w-name span").textContent = t.textContent.trim() || "Welcome";
      if(s) W.querySelector(".w-tag").textContent = s.textContent.trim();
    } else if(!lg.firstChild){ lg.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.500 5-3v-4.500"/></svg>'; var h=document.title.split("—"); W.querySelector(".w-name span").textContent=(h[0]||"Welcome").trim(); if(h[1]) W.querySelector(".w-tag").textContent=h[1].trim(); }
  }
  fillBrand(); var bi = setInterval(fillBrand, 250);
  var t0 = Date.now();
  function ready(){ try{ return typeof first !== "undefined" ? first === false : true; }catch(e){ return true; } }
  function closeW(){ if(!W) return; clearInterval(bi); W.classList.add("out"); var w=W; W=null; setTimeout(function(){ w.remove(); }, 950); }
  var wi = setInterval(function(){ var el = Date.now() - t0; if(el > 10000){ clearInterval(wi); closeW(); } }, 120);
  
  /* ---- scroll progress ---- */
  if(!RM){ var P = document.createElement("div"); P.id = "moProg"; document.body.appendChild(P);
    addEventListener("scroll", function(){ var h = document.documentElement; var m = h.scrollHeight - h.clientHeight; P.style.transform = "scaleX(" + (m > 0 ? Math.min(1, h.scrollTop / m) : 0) + ")"; }, {passive:true}); }
  /* ---- count-up numbers ---- */
  function countUp(el){
    var m = /^(\D*)(\d+(?:\.\d+)?)(.*)$/.exec(el.textContent.trim()); if(!m || el.children.length) return;
    var end = parseFloat(m[2]), dec = (m[2].split(".")[1] || "").length, st = null;
    (function f(ts){ st = st || ts; var p = Math.min(1, (ts - st) / 1300), e = 1 - Math.pow(1 - p, 4);
      el.textContent = m[1] + (end * e).toFixed(dec) + m[3]; if(p < 1) requestAnimationFrame(f); })(performance.now());
  }
  /* ---- entrance on page change ---- */
  function enter(){
    if(RM || document.body.classList.contains("noanim")){ entering = false; return; }
    var base = (document.getElementById("welcome") ? 10.1 : 0.05);
    host.classList.remove("mo-page"); void host.offsetWidth; host.classList.add("mo-page");
    var els = Array.prototype.slice.call(host.querySelectorAll(SEL)).filter(function(e){ return !e.parentElement.closest(SEL) || e.matches(".stat,.sec-h,.lock>*"); });
    if(io) io.disconnect(); var vh = innerHeight, n = 0; clearTimeout(safety);
    io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(es){ es.forEach(function(x){ if(x.isIntersecting){ var t = x.target; io.unobserve(t); t.style.setProperty("--d", "0s"); t.classList.remove("mo-hold"); t.classList.add("mo-in"); setTimeout(function(){ t.classList.remove("mo-in"); }, 900); } }); }, {rootMargin:"0px 0px -6% 0px", threshold:.05}) : null;
    els.forEach(function(e){
      var r = e.getBoundingClientRect();
      if(r.top < vh * .95 || !io){ e.style.setProperty("--d", (base + Math.min(n, 12) * .07).toFixed(2) + "s"); e.classList.add("mo-in"); n++; (function(t){ setTimeout(function(){ t.classList.remove("mo-in"); }, (base + 1.8) * 1000); })(e); }
      else { e.classList.add("mo-hold"); io.observe(e); }
    });
    host.querySelectorAll(".stat b").forEach(function(b){ setTimeout(function(){ countUp(b); }, base * 1000 + 250); });
    safety = setTimeout(function(){ host.querySelectorAll(".mo-hold").forEach(function(e){ e.classList.remove("mo-hold"); }); }, 16000);
    entering = false;
  }
  /* animate only on page changes (not on live Firebase re-renders) */
  ["go"].forEach(function(n){ var o = window[n]; if(typeof o === "function"){ window[n] = function(){ entering = true; return o.apply(this, arguments); }; } });
  document.addEventListener("click", function(e){ if(e.target.closest("[data-view],[data-ptab],[data-reg],[data-book],.row,.back,[data-back]")) entering = true; }, true);
  addEventListener("popstate", function(){ entering = true; });
  var firstPaint = true;
  new MutationObserver(function(){ clearTimeout(tmr); tmr = setTimeout(function(){ if(firstPaint && host.children.length && !document.getElementById("boot")){ firstPaint = false; entering = true; } if(entering) enter(); }, 30); }).observe(host, {childList:true});
  /* drawer stagger index */
  var dr = document.getElementById("drawer"); if(dr) new MutationObserver(function(){ dr.querySelectorAll("button").forEach(function(b, i){ b.style.setProperty("--k", i); }); }).observe(dr, {childList:true});
})();
</script>
