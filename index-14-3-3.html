  function merge(base, over) {

    if (base && typeof base === "object") {
      const o = {};
      for (const k in base) o[k] = merge(base[k], over[k]);

  const blobToB64 = blob => new Promise((res, rej) => {

    r.onload = () => { const s = String(r.result); res(s.slice(s.indexOf(",") + 1)); };
    r.onerror = () => rej(r.error || new Error("read failed"));

  });
  const b64ToBlob = (b64, type) => {

  };

  const pickVideoMime = () => {
    const c = ["video/webm;codecs=vp8,opus", "video/webm;codecs=vp9,opus", "video/webm", "video/mp4;codecs=avc1,mp4a.40.2", "video/mp4"];
    return c.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } }) || "";
  };
  const canVideo = () => {
    try { return typeof MediaRecorder !== "undefined" && !!HTMLCanvasElement.prototype.captureStream && !!pickVideoMime(); } catch (e) { return false; }

  /* ---- O/L qualification check ---- */
  const GRADE_MIN = { A: 75, B: 65, C: 50, S: 35, W: 0 };

  function evalOL(ol, entries) {
    const marks = ol.mode === "marks";
    const line = marks ? (Number(ol.minMarks) || 0) : (GRADE_MIN[ol.minGrade] != null ? GRADE_MIN[ol.minGrade] : 50);
    const lineTxt = marks ? line + " marks" : "grade " + (ol.minGrade || "C");
    const score = e => marks ? (Number(e.m) || 0) : (GRADE_MIN[e.g] || 0);
    const good = e => marks ? score(e) >= line : (e.g !== "W" && score(e) >= line);
    const count = entries.filter(good).length, reasons = [];
    if (count < (Number(ol.minCount) || 0)) reasons.push("Only " + count + " subject(s) reached " + lineTxt + " (needs " + ol.minCount + ")");
    Object.keys(ol.must || {}).forEach(k => {
      if (!ol.must[k]) return;
      const e = entries.find(x => x.k === k);
      if (!e || !good(e)) reasons.push((e ? e.l : k) + " must reach " + lineTxt);

    /* ----- media ----- */

    async saveMedia(blob, meta) {
      meta = meta || {};
      const id = api.uid("M"), type = blob.type || meta.mime || "application/octet-stream";
      const m = { id, k: meta.k || (/^video/.test(type) ? "video" : "image"), mime: type, size: blob.size, w: meta.w || 0, h: meta.h || 0, dur: meta.dur || 0, n: 0 };
      if (mode === "firebase") {

          try {
            const ref = firebase.storage().ref().child("vx_media/" + id);
            await ref.put(blob, { contentType: type });
            m.url = await ref.getDownloadURL();
            return m;
          } catch (e) { console.warn("Storage upload failed — using Firestore chunks", e); }
        }
        const b64 = await blobToB64(blob);
        m.n = Math.ceil(b64.length / MCH);
        try {
          for (let i = 0; i < m.n; i++) await Promise.race([db.collection("vx_media").doc(id + "_" + i).set({ mid: id, i, d: b64.slice(i * MCH, (i + 1) * MCH) }), new Promise((_, rej) => setTimeout(() => rej({ code: "unavailable", message: "no response from Firestore" }), 25000))]);
        } catch (e) { await api.deleteMedia(m); console.error("media upload", e); throw new Error("Upload failed: " + (e.code || e.message) + (e.code === "permission-denied" ? " — publish firestore.rules" : e.code === "not-found" || e.code === "unavailable" ? " — create Firestore Database / check internet" : "")); }
        return m;
      }
      const b64 = await blobToB64(blob);
      try { localStorage.setItem("vx_media_" + id, "data:" + type + ";base64," + b64); }
      catch (e) { throw new Error("Browser storage is full — connect Firebase to keep more photos / videos"); }
      return m;
    },
    mediaURL(m) {
      if (!m) return Promise.resolve("");
      if (m.url) return Promise.resolve(m.url);
      if (mCache.has(m.id)) return mCache.get(m.id);
      const p = (async () => {
        if (mode !== "firebase") { const d = localStorage.getItem("vx_media_" + m.id); if (!d) throw new Error("missing"); return d; }
        const docs = await Promise.all(Array.from({ length: m.n || 0 }, (_, i) => db.collection("vx_media").doc(m.id + "_" + i).get()));
        if (!docs.length || docs.some(d => !d.exists)) throw new Error("missing");
        return URL.createObjectURL(b64ToBlob(docs.map(d => d.data().d).join(""), m.k === "video" && !/^video\/(mp4|webm|ogg)/.test(m.mime || "") ? "video/mp4" : m.mime));
      })();
      mCache.set(m.id, p); p.catch(() => mCache.delete(m.id));
      return p;

        else if (mode === "firebase") await Promise.all(Array.from({ length: m.n || 0 }, (_, i) => db.collection("vx_media").doc(m.id + "_" + i).delete()));
        else localStorage.removeItem("vx_media_" + m.id);
      } catch (e) { console.warn("deleteMedia", e); }
    },

    /* ----- image compression: resize + JPEG re-encode until under target size ----- */
    async compressImage(file, o) {
      o = o || {};
      const maxDim = o.maxDim || 1280, target = (o.targetKB || 220) * 1024;
      let q = o.quality || 0.72, src, w, h, close = () => {};
      try {
        const b = await createImageBitmap(file, { imageOrientation: "from-image" });
        src = b; w = b.width; h = b.height; close = () => { try { b.close(); } catch (e) {} };
      } catch (e) {
        const u = URL.createObjectURL(file), im = new Image();
        await new Promise((res, rej) => { im.onload = res; im.onerror = () => rej(new Error("This image cannot be read")); im.src = u; });
        src = im; w = im.naturalWidth; h = im.naturalHeight; close = () => URL.revokeObjectURL(u);
      }
      let dim = maxDim, blob = null, cw = w, ch = h;
      for (let t = 0; t < 6; t++) {
        const s = Math.min(1, dim / Math.max(w, h));
        cw = Math.max(1, Math.round(w * s)); ch = Math.max(1, Math.round(h * s));
        const c = document.createElement("canvas"); c.width = cw; c.height = ch;
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, cw, ch); x.drawImage(src, 0, 0, cw, ch);
        blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
        if (!blob) { close(); throw new Error("Image compression failed"); }
        if (blob.size <= target) break;
        q = Math.max(0.45, q - 0.08); dim = Math.round(dim * 0.86);
      }
      close();
      return { blob, w: cw, h: ch, size: blob.size, orig: file.size };
    },

    /* ----- video compression: play the clip into a small canvas and re-record it at a low bitrate ----- */
    compressVideo(file, o) {
      o = o || {};
      return new Promise(async (resolve, reject) => {
        const maxH = o.maxH || 480, kbps = o.kbps || 450, maxSec = o.maxSec || 60, fps = 24;
        const url = URL.createObjectURL(file), v = document.createElement("video");
        let ac = null, rec = null, timer = null, finished = false;
        v.muted = false; v.playsInline = true; v.preload = "auto"; v.src = url;
        v.style.cssText = "position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none";
        document.body.appendChild(v);
        const cleanup = () => {
          clearInterval(timer);
          try { v.pause(); } catch (e) {}
          try { ac && ac.close(); } catch (e) {}
          v.remove(); URL.revokeObjectURL(url);
        };
        const fail = e => { if (finished) return; finished = true; cleanup(); try { rec && rec.state !== "inactive" && rec.stop(); } catch (x) {} reject(e instanceof Error ? e : new Error(String(e))); };
        try {
          await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error("This video cannot be read by the browser")); });
          if (!v.videoWidth || !v.videoHeight) throw new Error("This video cannot be read by the browser");
          const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : maxSec, use = Math.min(dur, maxSec);
          const sc = Math.min(1, maxH / Math.min(v.videoWidth, v.videoHeight));
          const ev = n => Math.max(2, Math.round(n / 2) * 2);
          const cw = ev(v.videoWidth * sc), ch = ev(v.videoHeight * sc);
          const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
          const cx = cv.getContext("2d");
          const stream = cv.captureStream(fps);
          try {
            ac = new (window.AudioContext || window.webkitAudioContext)();
            const srcN = ac.createMediaElementSource(v), dst = ac.createMediaStreamDestination();
            srcN.connect(dst);
            dst.stream.getAudioTracks().forEach(t => stream.addTrack(t));
            if (ac.state === "suspended") await ac.resume();
          } catch (e) { ac = null; }
          const mime = pickVideoMime();
          rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: kbps * 1000, audioBitsPerSecond: 64000 });
          const parts = [];
          rec.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
          rec.onerror = e => fail(e.error || new Error("Video recorder error"));
          rec.onstop = () => {
            if (finished) return; finished = true;
            const type = (rec.mimeType || mime || "video/webm").split(";")[0];
            const blob = new Blob(parts, { type });
            cleanup();
            if (!blob.size) return reject(new Error("Video compression produced an empty file"));
            resolve({ blob, w: cw, h: ch, dur: use, size: blob.size, orig: file.size });
          };
          const stop = () => { try { clearInterval(timer); if (rec.state !== "inactive") rec.stop(); } catch (e) { fail(e); } };
          rec.start(1000);
          v.currentTime = 0;
          try { await v.play(); } catch (e) { v.muted = true; await v.play(); }
          timer = setInterval(() => {
            try { cx.drawImage(v, 0, 0, cw, ch); } catch (e) {}
            if (o.onProgress) o.onProgress(Math.min(1, v.currentTime / use));
            if (v.ended || v.currentTime >= use - 0.05) stop();
          }, 1000 / fps);
          v.onended = stop;
        } catch (e) { fail(e); }
      });
    },

    /* ---------------- theme engine ---------------- */
    themeVars(t, userMode, userCustom) {
      const uc = userCustom || {};
      const eff = Object.assign({}, t, uc);
      const key = userMode && PRESETS[userMode] ? userMode : (PRESETS[eff.preset] ? eff.preset : "dark");
      const p = PRESETS[key];
      const a = eff.custom ? eff.accent : p.a;
      const b = eff.custom ? eff.accent2 : p.b;
      const glassVal = eff.glass == null ? 6 : eff.glass;
      const blurVal = eff.blur == null ? 24 : eff.blur;
      const glowOn = eff.glowOn !== false;
      return {
        "--bg": p.bg, "--bg2": p.bg2, "--text": p.text, "--muted": p.muted, "--cyan": a, "--amber": b,
        "--glass": p.light ? "rgba(255,255,255,.82)" : "rgba(255,255,255," + (glassVal / 100) + ")",
        "--glass-solid": p.light ? "rgba(255,255,255,.94)" : rgba(p.bg2, .92),
        "--glass-border": p.light ? rgba(a, .22) : "rgba(255,255,255,.11)",
        "--glass-hi": p.light ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.08)",
        "--nav-bg": p.light ? "rgba(248,248,252,.82)" : rgba(p.bg, .78),

        "--radius": (eff.radius == null ? 20 : eff.radius) + "px",
        "--blur": blurVal + "px",
        "--fh": "'" + (eff.fontHead || "Inter") + "',-apple-system,BlinkMacSystemFont,sans-serif",
        "--fb": "'" + (eff.fontBody || "Inter") + "',-apple-system,BlinkMacSystemFont,sans-serif",

    themeStyle(t, u, uc) { return Object.entries(api.themeVars(t, u, uc)).map(([k, v]) => k + ":" + v).join(";"); },

    },
    loadFonts(names) {

      });
    }
  };

  function hexRgb(h) {
    h = String(h || "#000").replace("#", "");
    if (h.length === 3) h = h.split("").map(c => c + c).join("");
    const n = parseInt(h, 16) || 0;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgba(h, a) { const [r, g, b] = hexRgb(h); return "rgba(" + r + "," + g + "," + b + "," + a + ")"; }
  api.rgba = rgba;

  /* ----- main teacher photo styles (shared by site + admin preview) ----- */
  api.photoShapes = {

    body:    { l: "Full body",     r: "0",                      a: "3/4.2", c: "none" },

  api.photoAttrs = function (P, k) {
    P = Object.assign({ shape: "circle", size: 176, posX: 50, posY: 20, zoom: 100, tilt: 0, flip: false, fit: "cover", ring: "gradient", dot: true, bg: "soft", border: true, side: "left", vis: 75 }, P || {});

      ";--phx:" + (Number(P.posX) || 0) + "%;--phy:" + (Number(P.posY) || 0) + "%;--phz:" + ((Number(P.zoom) || 100) / 100) +

    return { cls: "phs sh-" + P.shape, st, attrs: 'data-side="' + (P.side === "right" ? "right" : "left") + '" data-ring="' + P.ring + '" data-dot="' + (P.dot === false ? 0 : 1) + '"' };

})();

  .brand{
    font-weight:800; font-size:.92rem; letter-spacing:.2px;
    display:flex; align-items:center; gap:10px; min-width:0; white-space:nowrap; cursor:pointer;
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.15; min-width:0;}
  .brand-title{overflow:hidden; text-overflow:ellipsis;}
  .brand-title span{color:var(--amber);}
  .brand-sub{font-size:.66rem; color:var(--muted); font-weight:500; font-family:var(--fb);}
  .brand .lg{
    width:38px; height:38px; border-radius:12px; display:grid; place-items:center;
    font-size:1.25rem; background:linear-gradient(135deg, color-mix(in srgb,var(--amber) 24%,transparent), color-mix(in srgb,var(--cyan) 20%,transparent));
    border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);
    box-shadow:0 4px 14px color-mix(in srgb,var(--amber) 22%,transparent);
  }
  .brand .lg svg{width:20px; height:20px; fill:var(--amber);}
  .brand img{
    width:40px; height:40px; object-fit:cover; border-radius:13px; flex:none;
    box-shadow:0 0 0 1.5px var(--amber), 0 6px 16px rgba(0,0,0,.28);
  }
  .head-actions{display:flex; align-items:center; gap:8px;}
  .ios-icon-btn{
    height:38px; min-width:38px; padding:0 11px; border-radius:999px;
    background:var(--glass); border:1px solid var(--glass-border);
    color:var(--text); display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font:600 .76rem var(--fb); cursor:pointer;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    transition:transform .18s var(--spring), background .2s, border-color .2s;
  }
  .ios-icon-btn:active{transform:scale(.92);}
  .ios-icon-btn:hover{border-color:var(--cyan);}
  .menu-toggle{
    background:var(--glass); border:1px solid var(--glass-border);
    width:38px; height:38px; border-radius:50%;
    display:grid; place-content:center; gap:4.5px; cursor:pointer;
    transition:transform .18s var(--spring);
  }
  .menu-toggle:active{transform:scale(.9);}
  .me-btn{background:var(--glass); border:1px solid var(--glass-border); width:38px; height:38px; border-radius:50%; display:grid; place-items:center; cursor:pointer; color:var(--text); transition:transform .18s var(--spring);}
  .me-btn:active{transform:scale(.9);}
  .me-btn svg{width:19px; height:19px;}
  .me-btn.active{border-color:var(--amber); color:var(--amber);}
  .menu-toggle span{display:block; width:17px; height:2px; background:var(--text); border-radius:2px; transition:.2s;}

  #ann{
    display:none; padding:10px 16px; font-size:.8rem; font-weight:600; text-align:center;
    border-bottom:1px solid var(--line); backdrop-filter:blur(12px);
  }

  /* ---------------- Slide Sheet & Drawer ---------------- */
  .drawer-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.52);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    opacity:0; pointer-events:none; transition:opacity .28s var(--spring); z-index:90;
  }
  .drawer-overlay.open{opacity:1; pointer-events:auto;}
  .nav-drawer{
    position:fixed; top:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));
    width:270px; z-index:100; background:var(--glass-solid);
    backdrop-filter:blur(30px) saturate(190%); -webkit-backdrop-filter:blur(30px) saturate(190%);
    border:1px solid var(--glass-border); border-radius:28px;
    padding:22px 14px 18px; display:flex; flex-direction:column; gap:8px;
    transform:translateX(110%); transition:transform .34s var(--spring);
    overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .nav-drawer.open{transform:none;}
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 8px 12px; border-bottom:1px solid var(--line); margin-bottom:4px;
  }
  .drawer-head b{font-size:.85rem; color:var(--muted); letter-spacing:.6px; text-transform:uppercase;}
  .nav-drawer button{
    text-align:left; background:var(--glass); border:1px solid var(--line);
    color:var(--text); padding:13px 15px; border-radius:16px;
    font:600 .9rem var(--fb); cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    transition:transform .16s var(--spring), background .2s;
  }
  .nav-drawer button:active{transform:scale(.97);}
  .nav-drawer button.active{
    background:linear-gradient(135deg, var(--cyan), color-mix(in srgb, var(--cyan) 75%, #0051ff));
    color:#fff; border-color:transparent; box-shadow:0 6px 20px color-mix(in srgb, var(--cyan) 35%, transparent);
  }

  /* ---------------- Main Container & Cards ---------------- */
  main{max-width:860px; margin:0 auto; padding:16px 15px; animation:riseIn .36s var(--spring);}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .page-title{
    font-size:1.65rem; font-weight:800; letter-spacing:-.03em; line-height:1.15;
    display:flex; align-items:center; gap:8px;
  }
  .page-sub{color:var(--muted); font-size:.84rem; margin-top:3px;}

  .card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    box-shadow:0 8px 28px rgba(0,0,0,.14), inset 0 1px 0 var(--glass-hi);
    border-radius:var(--radius);
    padding:var(--pad);
    backdrop-filter:blur(var(--blur)) saturate(180%);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
    margin-bottom:14px;
    transition:transform .22s var(--spring), border-color .22s, box-shadow .22s;
  }
  .card h3{font-size:.96rem; font-weight:700; margin-bottom:5px; letter-spacing:-.01em;}
  .card p{color:var(--muted); font-size:.85rem; line-height:1.5;}
  .grid{display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(255px,1fr));}
  .grid .card{margin:0; display:flex; flex-direction:column; justify-content:space-between;}
  .grid .card:hover{border-color:color-mix(in srgb,var(--cyan) 50%,transparent); transform:translateY(-2px);}

  .tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px;}
  .tag{
    font-size:.72rem; font-weight:600; padding:4px 10px; border-radius:999px;
    background:color-mix(in srgb,var(--cyan) 12%,transparent);
    color:var(--cyan); border:1px solid color-mix(in srgb,var(--cyan) 26%,transparent);
  }

  /* ---------------- Buttons ---------------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 20px; min-height:48px;
    border-radius:calc(var(--radius) * .8); border:0; cursor:pointer;
    font-family:var(--fb); font-weight:700; font-size:.86rem; letter-spacing:.2px;
    transition:transform .18s var(--spring), box-shadow .2s, opacity .2s; width:100%;
  }
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-main{
    background:linear-gradient(135deg, var(--amber), color-mix(in srgb, var(--amber) 72%, #ff5e00));
    color:#140d00;
    box-shadow:0 8px 24px color-mix(in srgb, var(--amber) 34%, transparent), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .btn-cyan{
    background:linear-gradient(135deg, var(--cyan), color-mix(in srgb, var(--cyan) 75%, #0051ff));
    color:#fff;
    box-shadow:0 8px 22px color-mix(in srgb, var(--cyan) 32%, transparent), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .btn-ghost{
    background:var(--glass); color:var(--text);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(12px);
  }
  .btn-ghost:hover{border-color:var(--cyan); color:var(--cyan);}
  .btn-sm{width:auto; min-height:38px; padding:8px 15px; font-size:.78rem; border-radius:999px;}
  .btn-red{background:rgba(255,69,58,.12); color:var(--red); border:1px solid rgba(255,69,58,.3);}
  .btn-row{display:flex; gap:9px; flex-wrap:wrap;} .btn-row .btn{flex:1; min-width:110px;}

  /* ---------------- Home Hero & Widgets ---------------- */
  .hero{
    position:relative; padding:26px 20px;
    border-radius:calc(var(--radius) * 1.3); overflow:hidden;
    border:1px solid var(--glass-border);
    background:
      radial-gradient(circle at 88% 16%, color-mix(in srgb,var(--amber) 24%,transparent), transparent 52%),
      radial-gradient(circle at 12% 88%, color-mix(in srgb,var(--cyan) 22%,transparent), transparent 55%),
      linear-gradient(145deg, color-mix(in srgb,var(--bg2) 82%,transparent), var(--glass));
    box-shadow:0 18px 42px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.14);
    margin-bottom:14px;
  }
  .hero .bolt{position:absolute; right:-18px; top:-14px; width:156px; height:156px; opacity:.95; pointer-events:none;}
  .hero .bolt .ring{position:absolute; inset:0; border-radius:50%; border:1.5px dashed color-mix(in srgb,var(--cyan) 40%,transparent); animation:spin 28s linear infinite;}
  .hero .bolt .ring.b{inset:17%; border-color:color-mix(in srgb,var(--amber) 55%,transparent); animation-direction:reverse; animation-duration:18s;}
  .hero .bolt .core{
    position:absolute; inset:0; display:grid; place-items:center;
    font-size:3.1rem; color:var(--amber); filter:drop-shadow(0 0 16px var(--amber));
    animation:floatSlow 3.6s ease-in-out infinite;
  }
  .hero .bolt .core svg{width:1em; height:1em; fill:currentColor;}
  .hero .bolt .core img{
    width:64%; height:64%; border-radius:24px; object-fit:cover;
    box-shadow:0 0 0 2px var(--amber), 0 10px 26px rgba(0,0,0,.45);
  }
  .badge{
    display:inline-flex; align-items:center; gap:7px;
    font-size:.73rem; font-weight:700; color:var(--green);
    border:1px solid rgba(48,209,88,.35); background:rgba(48,209,88,.11);
    padding:5px 13px; border-radius:999px; margin-bottom:14px; position:relative;
    backdrop-filter:blur(10px);
  }
  .badge i{width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulseDot 1.8s infinite;}
  .hero h1{font-size:1.88rem; font-weight:900; line-height:1.12; margin-bottom:10px; position:relative; max-width:74%; letter-spacing:-.03em;}
  .hero h1 em{
    font-style:normal;
    background:linear-gradient(135deg, var(--amber), #ff7b00);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{color:var(--muted); font-size:.87rem; margin-bottom:18px; position:relative; max-width:85%; line-height:1.55;}
  .hero.nobolt h1,.hero.nobolt p{max-width:100%;}
  .hero-btns{display:flex; gap:10px; flex-wrap:wrap; position:relative;}
  .hero-btns .btn-main{flex:2; min-width:190px;}
  .hero-btns .btn-ghost{flex:1; min-width:130px;}


  .main-teacher-profile{position:relative;z-index:1;display:flex;align-items:center;gap:18px;padding:17px;margin:0 0 23px;border:1px solid rgba(255,255,255,.52);border-radius:25px;background:rgba(255,255,255,.66);box-shadow:0 12px 28px rgba(25,45,80,.09);backdrop-filter:blur(18px);}
  .main-teacher-photo{width:118px;height:138px;flex:0 0 118px;overflow:hidden;border-radius:23px;background:linear-gradient(145deg,#e5edfb,#f5f7fc);display:grid;place-items:center;color:#3778d5;font-size:3rem;box-shadow:0 7px 18px rgba(36,83,150,.13);}
  .main-teacher-photo img{width:100%;height:100%;object-fit:cover;}
  .main-teacher-copy{min-width:0;}
  .main-teacher-label{display:inline-flex;align-items:center;gap:7px;margin-bottom:8px;font-size:.66rem;font-weight:850;letter-spacing:.14em;color:#2878d8;}
  .main-teacher-label i{width:7px;height:7px;border-radius:50%;background:#2878d8;box-shadow:0 0 0 4px rgba(40,120,216,.12);}
  .main-teacher-copy h2{margin:0 0 6px;color:#17243b;font-size:clamp(1.45rem,5vw,2.15rem);font-weight:900;line-height:1.08;letter-spacing:-.045em;overflow-wrap:anywhere;}
  .main-teacher-copy p{margin:5px 0;color:#647086;font-size:.78rem;line-height:1.45;overflow-wrap:anywhere;}
  .main-teacher-copy p b{color:#283a56;}
  .main-teacher-copy .main-teacher-qualification{font-weight:750;color:#2878d8;font-size:.86rem;}
  .main-teacher-detail{white-space:pre-line;}
  @media(max-width:480px){.main-teacher-profile{gap:13px;padding:13px;margin-bottom:19px;border-radius:22px}.main-teacher-photo{width:96px;height:116px;flex-basis:96px;border-radius:19px}.main-teacher-copy h2{font-size:1.42rem}.main-teacher-copy p{font-size:.73rem}}
  @media(max-width:350px){.main-teacher-profile{align-items:flex-start;gap:10px;padding:10px}.main-teacher-photo{width:78px;height:98px;flex-basis:78px}.main-teacher-copy h2{font-size:1.2rem}}

  /* Quick Action Pills */
  .quick{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:16px;}
  @media (max-width:460px){.quick{grid-template-columns:repeat(2,1fr);}}
  .quick-item{
    display:flex; align-items:center; gap:9px; padding:12px 13px;
    border-radius:calc(var(--radius) * .85);
    border:1px solid var(--glass-border); background:var(--glass);
    backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur));
    font:700 .78rem var(--fb); cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.1);
    transition:transform .18s var(--spring), border-color .2s;
  }
  .quick-item:active{transform:scale(.95);}
  .quick-item:hover{border-color:var(--cyan);}
  .quick-ico{
    width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
    font-size:1.05rem; flex:none;
    background:color-mix(in srgb,var(--cyan) 15%,transparent);
  }
  .quick-item small{display:block; font-size:.66rem; color:var(--muted); font-weight:500;}

  /* Bento Stats */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(105px,1fr)); gap:10px; margin-bottom:16px;}
  .stat{
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:var(--radius); padding:14px 10px; text-align:center;
    backdrop-filter:blur(var(--blur)); box-shadow:inset 0 1px 0 var(--glass-hi);
  }
  .stat b{font-family:var(--fh); font-size:1.32rem; font-weight:800; color:var(--cyan); display:block; line-height:1.2;}
  .stat small{color:var(--muted); font-size:.73rem; font-weight:600;}

  /* Section Headers */
  .sec-h{display:flex; justify-content:space-between; align-items:center; margin:22px 2px 11px;}
  .sec-h h2{font-size:.82rem; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:7px;}
  .sec-h a{
    font-size:.78rem; color:var(--cyan); font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; gap:3px;
    padding:4px 10px; border-radius:999px; background:color-mix(in srgb,var(--cyan) 10%,transparent);
  }
  .ar{width:14px; height:14px;}

  /* Horizontal Snap Cards */
  .hscroll{
    display:flex; gap:11px; overflow-x:auto; padding:2px 16px 10px;
    margin:0 -15px; scroll-snap-type:x mandatory; scrollbar-width:none;
  }
  .hscroll::-webkit-scrollbar{display:none;}
  .mini{
    flex:none; width:168px; scroll-snap-align:start;
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:var(--radius); padding:15px; cursor:pointer;
    backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur));
    box-shadow:0 6px 20px rgba(0,0,0,.12), inset 0 1px 0 var(--glass-hi);
    transition:transform .2s var(--spring), border-color .2s;
    display:flex; flex-direction:column; justify-content:space-between; gap:6px;
  }
  .mini:active{transform:scale(.95);}
  .mini:hover{border-color:var(--cyan);}
  .mini .e{
    width:44px; height:44px; border-radius:14px; display:grid; place-items:center;
    font-size:1.45rem; background:linear-gradient(135deg, color-mix(in srgb,var(--cyan) 18%,transparent), color-mix(in srgb,var(--amber) 14%,transparent));
    border:1px solid var(--glass-border); margin-bottom:4px;
  }
  .mini b{font-size:.86rem; font-weight:700; line-height:1.25; display:block;}
  .mini .mini-foot{display:flex; align-items:center; justify-content:space-between; margin-top:4px; font-size:.73rem; color:var(--amber); font-weight:700;}

  /* Grouped Info Rows */
  .ios-list-card{padding:4px 16px;}
  .info-row{
    display:flex; gap:13px; align-items:center; padding:13px 0;
    border-bottom:1px solid var(--line); font-size:.88rem;
  }
  .info-row:last-child{border:0;}
  .info-row .e{
    width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
    font-size:1.15rem; flex:none;
    background:color-mix(in srgb,var(--cyan) 14%,transparent);
    border:1px solid color-mix(in srgb,var(--cyan) 24%,transparent);
  }
  .info-row small{color:var(--muted); display:block; font-size:.75rem; margin-top:1px;}

  /* Services & Team Cards */
  .svc-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .svc-ico{
    width:50px; height:50px; border-radius:16px; display:grid; place-items:center;
    font-size:1.55rem; background:linear-gradient(135deg, color-mix(in srgb,var(--cyan) 20%,transparent), color-mix(in srgb,var(--amber) 16%,transparent));
    border:1px solid var(--glass-border); box-shadow:inset 0 1px 0 var(--glass-hi);
  }
  .svc-foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); gap:8px;}
  .price{
    font-size:.76rem; color:var(--amber); font-weight:700;
    background:color-mix(in srgb,var(--amber) 14%,transparent);
    border:1px solid color-mix(in srgb,var(--amber) 28%,transparent);
    padding:5px 11px; border-radius:999px;
  }

  .elec-top{display:flex; align-items:center; gap:13px; margin-bottom:11px;}
  .avatar{
    width:54px; height:54px; border-radius:18px; display:grid; place-items:center; flex:none;
    font-family:var(--fh); font-weight:900; font-size:1.2rem; color:#0b0e14;
    background:linear-gradient(135deg,var(--cyan),var(--amber));
    box-shadow:0 6px 16px color-mix(in srgb,var(--cyan) 26%,transparent);
  }
  .elec-top small{color:var(--muted); font-size:.78rem; display:block; margin-top:2px;}
  .avail{
    font-size:.74rem; font-weight:700; display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px; border-radius:999px;
  }
  .avail i{width:7px; height:7px; border-radius:50%; background:currentColor;}
  .avail.on{color:var(--green); background:rgba(48,209,88,.12);}
  .avail.busy{color:var(--amber); background:rgba(255,184,77,.12);}
  .meta{
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0;
    padding:10px; border-radius:13px; background:color-mix(in srgb,var(--bg) 45%,transparent);
    border:1px solid var(--line); font-size:.78rem; color:var(--muted); text-align:center;
  }
  .meta b{color:var(--text); font-size:.95rem; display:block;}

  /* ==========================================================
     FULL UPGRADED BOOKING PAGE STYLES
     ========================================================== */
  .book-steps{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    margin-bottom:14px; padding:6px; border-radius:16px;
    background:var(--glass); border:1px solid var(--glass-border);
  }
  .book-step{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 8px; border-radius:12px; font-size:.75rem; font-weight:700;
    color:var(--muted); transition:.22s var(--spring);
  }
  .book-step.active{
    background:color-mix(in srgb,var(--cyan) 16%,transparent);
    color:var(--cyan); border:1px solid color-mix(in srgb,var(--cyan) 32%,transparent);
  }
  .book-step.done{color:var(--green);}


  /* ---------------- Posts / Events / Register ---------------- */
  .reg-step{display:flex; align-items:center; gap:10px; margin:18px 2px 10px; font-weight:800; font-size:.8rem; letter-spacing:.6px; color:var(--muted);}
  .reg-step i{font-style:normal; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--amber); color:#111; font-size:.78rem; font-weight:900;}
  .ev-pick{display:flex; gap:12px; align-items:center; padding:12px; margin-bottom:10px; border-radius:18px; cursor:pointer; background:var(--glass); border:1.5px solid var(--glass-border); transition:transform .18s var(--spring), border-color .2s, box-shadow .2s;}
  .ev-pick:active{transform:scale(.98);}
  .ev-pick.sel{border-color:var(--amber); box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 22%,transparent);}
  .ev-pick .ev-date{width:52px;}
  .ev-pick .ev-info{flex:1; min-width:0;}
  .ev-pick h3{margin:0 0 3px; font-size:.95rem;}
  .ev-pick .ev-line{font-size:.76rem; color:var(--muted);}
  .ev-pick .tick{flex:none; width:24px; height:24px; border-radius:50%; border:2px solid var(--glass-border); display:grid; place-items:center; font-size:.8rem; font-weight:900; color:transparent;}
  .ev-pick.sel .tick{background:var(--amber); border-color:var(--amber); color:#111;}
  .reg-sum{margin:14px 0 4px; padding:12px 14px; border-radius:14px; background:color-mix(in srgb,var(--amber) 12%,transparent); border:1px dashed color-mix(in srgb,var(--amber) 50%,transparent); font-size:.84rem; line-height:1.5;}
  .reg-sum b{color:var(--amber);}
  .sub-seg{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:5px; border-radius:15px; margin-bottom:16px;
    background:color-mix(in srgb,var(--bg) 55%,var(--glass)); border:1px solid var(--line);}
  .sub-seg button{border:0; background:transparent; color:var(--muted); padding:11px 6px; border-radius:11px; font:800 .82rem var(--fb); cursor:pointer; min-height:44px;}
  .sub-seg button.on{background:var(--glass-solid); color:var(--text); border:1px solid var(--glass-border); box-shadow:0 4px 14px rgba(0,0,0,.22), inset 0 1px 0 var(--glass-hi);}
  .post-card{margin-bottom:13px;}
  .post-meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; font-size:.72rem; color:var(--muted);}
  .post-meta .pin{color:var(--amber); font-weight:800;}
  .post-card h3{margin:0 0 6px;}
  .post-body{white-space:pre-wrap; word-break:break-word; color:var(--muted); font-size:.88rem; line-height:1.6;}
  .ev-card{display:flex; gap:14px; align-items:flex-start;}
  .ev-date{flex:none; width:58px; border-radius:16px; text-align:center; padding:8px 4px; border:1px solid var(--glass-border);
    background:linear-gradient(135deg,color-mix(in srgb,var(--cyan) 20%,transparent),color-mix(in srgb,var(--amber) 14%,transparent));}
  .ev-date b{display:block; font-size:1.35rem; line-height:1.1; font-weight:900;}
  .ev-date small{font-size:.66rem; font-weight:800; letter-spacing:.6px; color:var(--muted); text-transform:uppercase;}
  .ev-info{flex:1; min-width:0;}
  .ev-info h3{margin:0 0 4px;}
  .ev-line{font-size:.8rem; color:var(--muted); margin-top:3px;}
  .ev-ended{opacity:.6;}
  .read-more{display:inline-block; margin-top:10px; color:var(--cyan); font-weight:700; font-size:.82rem;}

  /* Urgency Segmented Control */
  .ios-seg{
    display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
    padding:5px; border-radius:15px; background:color-mix(in srgb,var(--bg) 55%,var(--glass));
    border:1px solid var(--line); margin-bottom:6px;
  }
  .ios-seg button{
    border:0; background:transparent; color:var(--muted);
    padding:10px 6px; border-radius:11px; font:700 .76rem var(--fb);
    cursor:pointer; transition:.2s var(--spring); display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .ios-seg button small{font-size:.63rem; font-weight:500; opacity:.8;}
  .ios-seg button.on{
    background:var(--glass-solid); color:var(--text);
    box-shadow:0 4px 14px rgba(0,0,0,.22), inset 0 1px 0 var(--glass-hi);
    border:1px solid var(--glass-border);
  }
  .ios-seg button.on[data-urg="Emergency 24/7"]{color:var(--red); border-color:rgba(255,69,58,.4);}
  .ios-seg button.on[data-urg="Express Today"]{color:var(--amber); border-color:rgba(255,184,77,.4);}

  /* Visual Service Picker Grid in Book Page */
  .svc-pick-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:9px;
    margin-bottom:6px;
  }
  .svc-pick-card{
    position:relative; text-align:left; padding:12px;
    border-radius:16px; border:1.5px solid var(--line);
    background:color-mix(in srgb,var(--bg) 35%,var(--glass));
    color:var(--text); cursor:pointer; transition:.2s var(--spring);
    display:flex; flex-direction:column; gap:5px;
  }
  .svc-pick-card:active{transform:scale(.96);}
  .svc-pick-card .sp-top{display:flex; justify-content:space-between; align-items:center;}
  .svc-pick-card .sp-emo{font-size:1.4rem;}
  .svc-pick-card .sp-chk{
    width:20px; height:20px; border-radius:50%; border:1.5px solid var(--muted);
    display:grid; place-items:center; font-size:.68rem; color:transparent; transition:.18s;
  }
  .svc-pick-card b{font-size:.8rem; line-height:1.25; display:block;}
  .svc-pick-card small{font-size:.68rem; color:var(--amber); font-weight:600;}
  .svc-pick-card.on{
    border-color:var(--cyan);
    background:color-mix(in srgb,var(--cyan) 14%,var(--glass));
    box-shadow:0 6px 18px color-mix(in srgb,var(--cyan) 18%,transparent);
  }
  .svc-pick-card.on .sp-chk{background:var(--cyan); border-color:var(--cyan); color:#fff;}

  /* Visual Electrician Picker Strip */
  .elec-pick-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;
  }
  .elec-pick-row::-webkit-scrollbar{display:none;}
  .elec-pill{
    flex:none; display:flex; align-items:center; gap:9px;
    padding:9px 13px; border-radius:14px; border:1.5px solid var(--line);
    background:color-mix(in srgb,var(--bg) 35%,var(--glass));
    color:var(--text); cursor:pointer; font:600 .78rem var(--fb); transition:.18s var(--spring);
  }
  .elec-pill .ep-av{
    width:30px; height:30px; border-radius:10px; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--cyan),var(--amber)); color:#111; font-weight:800; font-size:.82rem;
  }
  .elec-pill small{display:block; font-size:.66rem; color:var(--muted); font-weight:500;}
  .elec-pill.on{
    border-color:var(--cyan);
    background:color-mix(in srgb,var(--cyan) 14%,var(--glass));
  }

  /* 7-Day Calendar Strip (#dayChips) */
  .cal-strip{
    display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:none;
  }
  .cal-strip::-webkit-scrollbar{display:none;}
  .cal-day{
    flex:none; min-width:68px; padding:10px 8px; border-radius:16px;
    border:1.5px solid var(--line);
    background:color-mix(in srgb,var(--bg) 35%,var(--glass));
    color:var(--text); cursor:pointer; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    transition:.18s var(--spring);
  }
  .cal-day:active{transform:scale(.94);}
  .cal-day small{font-size:.64rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.4px;}
  .cal-day b{font-size:1.1rem; font-family:var(--fh); font-weight:800; line-height:1.15;}
  .cal-day u{text-decoration:none; font-size:.63rem; color:var(--muted);}
  .cal-day.on{
    background:linear-gradient(145deg, var(--cyan), color-mix(in srgb,var(--cyan) 72%,#0051ff));
    color:#fff; border-color:transparent;
    box-shadow:0 6px 18px color-mix(in srgb,var(--cyan) 34%,transparent);
  }
  .cal-day.on small,.cal-day.on u{color:rgba(255,255,255,.85);}

  /* Time Chips (#timeChips) */
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:2px;}
  .chips button{
    border:1.5px solid var(--line);
    background:color-mix(in srgb,var(--bg) 35%,var(--glass));
    color:var(--text); padding:10px 14px; border-radius:13px;
    font:700 .78rem var(--fb); cursor:pointer; transition:.16s var(--spring);
    display:inline-flex; align-items:center; gap:5px;
  }
  .chips button:active{transform:scale(.95);}
  .chips button.on{
    background:linear-gradient(135deg, var(--amber), color-mix(in srgb,var(--amber) 75%,#ff6a00));
    color:#140d00; border-color:transparent;
    box-shadow:0 5px 15px color-mix(in srgb,var(--amber) 32%,transparent);
  }
  .chips button:disabled{opacity:.28; text-decoration:line-through; cursor:not-allowed;}

  /* Quick Problem Tags & Area Chips */
  .quick-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .qtag{
    border:1px solid var(--glass-border); background:var(--glass);
    color:var(--muted); padding:6px 11px; border-radius:999px;
    font:600 .72rem var(--fb); cursor:pointer; transition:.16s;
  }
  .qtag:hover,.qtag.on{border-color:var(--amber); color:var(--amber); background:color-mix(in srgb,var(--amber) 12%,transparent);}

  /* Form Inputs */
  label{
    display:flex; align-items:center; justify-content:space-between;
    font-size:.72rem; font-weight:700; color:var(--muted);
    margin:15px 0 7px; letter-spacing:.6px; text-transform:uppercase;
  }
  label:first-child{margin-top:0;}
  input,select,textarea{
    width:100%; background:color-mix(in srgb,var(--bg) 42%,var(--glass));
    border:1.5px solid var(--line); border-radius:calc(var(--radius) * .72);
    padding:12px 14px; min-height:48px; color:var(--text);
    font:500 .92rem var(--fb); outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  select option{background:var(--bg2); color:var(--text);}
  input:focus,select:focus,textarea:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3.5px color-mix(in srgb,var(--cyan) 20%,transparent);
  }
  textarea{resize:vertical; min-height:84px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:480px){.row2{grid-template-columns:1fr;}}
  .err{color:var(--red); font-size:.8rem; font-weight:600; min-height:20px; margin:10px 0 4px;}
  .invalid{border-color:var(--red)!important; box-shadow:0 0 0 3px rgba(255,69,58,.2)!important; animation:shake .3s;}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  /* Live Booking Summary Bar */
  .book-summary{
    margin:14px 0 12px; padding:13px 15px; border-radius:16px;
    background:linear-gradient(135deg, color-mix(in srgb,var(--cyan) 12%,transparent), color-mix(in srgb,var(--amber) 10%,transparent));
    border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .book-summary .bs-left small{font-size:.68rem; color:var(--muted); text-transform:uppercase; font-weight:700; letter-spacing:.5px; display:block;}
  .book-summary .bs-left b{font-size:.9rem; color:var(--text); display:block;}
  .book-summary .bs-right{font-size:.76rem; font-weight:700; color:var(--amber); background:color-mix(in srgb,var(--amber) 14%,transparent); padding:5px 11px; border-radius:999px;}

  /* Apple Wallet Style Pass Ticket */
  .ticket{
    position:relative; border-radius:24px; padding:20px;
    background:linear-gradient(145deg, color-mix(in srgb,var(--amber) 16%,var(--bg2)), var(--bg2));
    border:1.5px solid color-mix(in srgb,var(--amber) 48%,transparent);
    box-shadow:0 16px 40px rgba(0,0,0,.35);
    animation:riseIn .4s var(--spring); margin-bottom:18px; overflow:hidden;
  }
  .ticket-head{display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px dashed var(--glass-border); margin-bottom:12px;}
  .ticket .ordn{font-size:1.35rem; font-weight:900; color:var(--amber); letter-spacing:1px;}
  .ticket-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; font-size:.82rem;}
  .ticket-grid small{color:var(--muted); font-size:.68rem; display:block; text-transform:uppercase;}
  .ticket-grid b{color:var(--text); font-size:.86rem;}

  /* ---------------- Bookings & Reviews ---------------- */
  .bk{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .bk small{color:var(--muted); font-size:.78rem; display:block; margin-top:2px;}
  .st{font-size:.68rem; font-weight:800; padding:4px 11px; border-radius:999px; letter-spacing:.5px; white-space:nowrap;}
  .st.pending{color:var(--amber); background:color-mix(in srgb,var(--amber) 16%,transparent); border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);}
  .st.confirmed{color:var(--cyan); background:color-mix(in srgb,var(--cyan) 16%,transparent); border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);}
  .st.done{color:var(--green); background:rgba(48,209,88,.14); border:1px solid rgba(48,209,88,.3);}
  .st.cancelled{color:var(--red); background:rgba(255,69,58,.14); border:1px solid rgba(255,69,58,.3);}

  .empty{text-align:center; color:var(--muted); padding:32px 14px; font-size:.9rem;}
  .empty .e{font-size:2.2rem; display:block; margin-bottom:8px;}

  .rev-head{
    display:flex; gap:18px; align-items:center; margin-bottom:14px;
    padding:16px; border-radius:var(--radius); background:var(--glass); border:1px solid var(--glass-border);
  }
  .avg{font-family:var(--fh); font-size:3rem; font-weight:900; color:var(--amber); line-height:1;}
  .stars{color:var(--amber); display:inline-flex; gap:2px;}
  .stars span{display:inline-flex; gap:2px;}
  .stars .off{color:rgba(128,128,128,.32);}
  .stars svg{width:16px; height:16px; fill:currentColor;}
  .who{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px;}
  .who>div{display:flex; align-items:center; gap:10px;}
  .who small{color:var(--muted); font-size:.73rem;}
  .av{
    width:36px; height:36px; border-radius:12px; flex:none; display:grid; place-items:center;
    font:800 .85rem var(--fh); color:#111; background:linear-gradient(135deg,var(--cyan),var(--amber));
  }
  .star-pick{display:flex; gap:8px; cursor:pointer; user-select:none; padding:4px 0;}
  .star-pick span{color:rgba(128,128,128,.35); transition:transform .16s var(--spring), color .16s; display:inline-flex;}
  .star-pick span:active{transform:scale(1.25);}
  .star-pick span.on{color:var(--amber); filter:drop-shadow(0 0 8px color-mix(in srgb,var(--amber) 55%,transparent));}
  .star-pick svg{width:34px; height:34px; fill:currentColor; display:block;}

  .dist{margin:0 0 16px; display:grid; gap:6px; padding:14px 16px; border-radius:var(--radius); background:var(--glass); border:1px solid var(--glass-border);}
  .dist div{display:flex; align-items:center; gap:10px; font-size:.74rem; color:var(--muted);}
  .dist b{width:14px; color:var(--text);}
  .dist i{flex:1; height:7px; border-radius:6px; background:var(--line); overflow:hidden; display:block;}
  .dist i u{display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--amber)); border-radius:6px; transition:width .6s;}
  .dist span{width:24px; text-align:right;}

  /* ---------------- Me & Settings ---------------- */
  .me-head{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .me-head-left{display:flex; align-items:center; gap:14px;}
  .me-head .avatar{width:62px; height:62px; border-radius:20px; font-size:1.5rem;}
  .hours{width:100%; font-size:.84rem; margin-top:8px; border-collapse:collapse;}
  .hours td{padding:8px 0; color:var(--muted); border-bottom:1px solid var(--line);}
  .hours tr:last-child td{border:0;}
  .hours td:last-child{text-align:right; color:var(--text); font-weight:600;}

  .theme-row{display:flex; gap:8px; flex-wrap:wrap;}
  .theme-row button{
    flex:1; min-width:85px; padding:11px 12px;
    background:var(--glass); border:1.5px solid var(--glass-border);
    color:var(--text); border-radius:14px; font:700 .8rem var(--fb); cursor:pointer;
    transition:.18s var(--spring);
  }
  .theme-row button.active{
    border-color:var(--cyan);
    background:color-mix(in srgb,var(--cyan) 15%,transparent);
    color:var(--cyan);
  }

  footer{text-align:center; color:var(--muted); font-size:.76rem; padding:22px 16px 8px;}
  footer a{display:inline-block; color:inherit; font-weight:600; text-decoration:none; padding:10px 14px; letter-spacing:.3px;}
  footer a:active{opacity:.6;}

  /* ---------------- Floating Glass Dock ---------------- */
  .bottom-nav{
    position:fixed; z-index:80;
    left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto;
    display:flex; justify-content:space-around; gap:4px;
    padding:6px; border-radius:26px;
    background:var(--nav-bg);
    backdrop-filter:blur(28px) saturate(200%);
    -webkit-backdrop-filter:blur(28px) saturate(200%);
    border:1px solid var(--glass-border);
    box-shadow:0 14px 36px rgba(0,0,0,.38), inset 0 1px 0 var(--glass-hi);
  }
  .bottom-nav button{
    flex:1; min-height:50px; border:0; border-radius:20px;
    background:transparent; color:var(--muted);
    font:600 .66rem var(--fb);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    cursor:pointer; transition:all .22s var(--spring); position:relative;
  }
  .bottom-nav button svg{width:22px; height:22px; display:block; transition:transform .22s var(--spring);}
  .bottom-nav button.active{
    color:var(--cyan); font-weight:800;
    background:color-mix(in srgb,var(--cyan) 14%,transparent);
  }
  .bottom-nav button.active svg{
    transform:translateY(-2px) scale(1.06);
    filter:drop-shadow(0 2px 8px color-mix(in srgb,var(--cyan) 50%,transparent));
    stroke-width:2.3;
  }
  .bottom-nav button.book-btn{color:var(--amber);}
  .bottom-nav button.book-btn.active{
    background:color-mix(in srgb,var(--amber) 16%,transparent);
    color:var(--amber);
  }

  #fab{
    position:fixed; right:16px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:70;
    width:52px; height:52px; border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#25d366,#128c7e); color:#fff;
    box-shadow:0 10px 26px rgba(37,211,102,.38), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .2s var(--spring);
  }
  #fab:active{transform:scale(.9);}
  #fab svg{width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

  #boot{text-align:center; padding:80px 20px; color:var(--muted);}
  #boot .spin{width:36px; height:36px; margin:0 auto 14px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--cyan); animation:spin .8s linear infinite;}

  /* ---------------- Dynamic Island Toast ---------------- */
  #toast{
    position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top));
    transform:translate(-50%,-150%) scale(.9); z-index:300;
    max-width:92%; padding:11px 20px; border-radius:999px;
    font:700 .82rem var(--fb);
    background:rgba(18,22,32,.92); color:#fff;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 14px 34px rgba(0,0,0,.45);
    transition:transform .32s var(--spring);
  }
  #toast.show{transform:translate(-50%,0) scale(1);}
  #toast.err{border-color:var(--red); color:#ff8078;}

  /* ==========================================================
     APPEARANCE STUDIO BOTTOM SHEET & ACTION MODAL
     ========================================================== */
  .sheet-backdrop{
    position:fixed; inset:0; z-index:210;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    opacity:0; pointer-events:none; transition:opacity .28s var(--spring);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .ios-sheet{
    width:100%; max-width:580px; max-height:86vh;
    background:var(--glass-solid);
    backdrop-filter:blur(34px) saturate(200%); -webkit-backdrop-filter:blur(34px) saturate(200%);
    border:1px solid var(--glass-border);
    border-radius:30px 30px 0 0;
    padding:12px 18px calc(26px + env(safe-area-inset-bottom));
    overflow-y:auto;
    transform:translateY(102%); transition:transform .36s var(--spring);
    box-shadow:0 -18px 50px rgba(0,0,0,.45);
  }
  .sheet-backdrop.open .ios-sheet{transform:translateY(0);}
  .sheet-grab{width:42px; height:5px; border-radius:99px; background:var(--muted); opacity:.4; margin:2px auto 12px;}
  .sheet-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet-top h3{font-size:1.1rem; font-weight:800;}

  .preset-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
  @media (max-width:420px){.preset-grid{grid-template-columns:repeat(2,1fr);}}
  .preset-btn{
    padding:10px 8px; border-radius:16px; border:1.5px solid var(--line);
    background:var(--glass); color:var(--text); cursor:pointer;
    display:flex; align-items:center; gap:8px; font:700 .75rem var(--fb);
    transition:.18s var(--spring);
  }
  .preset-btn:active{transform:scale(.95);}
  .preset-btn.on{border-color:var(--cyan); background:color-mix(in srgb,var(--cyan) 15%,transparent);}
  .preset-dot{width:24px; height:24px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:.8rem; border:1px solid rgba(255,255,255,.2);}

  .swatch-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0 12px;}
  .swatch{
    width:32px; height:32px; border-radius:50%; border:2px solid transparent;
    cursor:pointer; transition:transform .16s;
  }
  .swatch:active{transform:scale(.88);}
  .swatch.on{border-color:#fff; box-shadow:0 0 0 2px var(--cyan); transform:scale(1.08);}

  .studio-group{
    background:color-mix(in srgb,var(--bg) 42%,var(--glass));
    border:1px solid var(--line); border-radius:18px;
    padding:4px 14px; margin-bottom:12px;
  }
  .studio-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:11px 0; border-bottom:1px solid var(--line); font-size:.85rem;
  }
  .studio-row:last-child{border:0;}
  .studio-row b{font-weight:600;}
  .studio-row small{display:block; color:var(--muted); font-size:.72rem;}
  .studio-slider{width:130px; accent-color:var(--cyan); min-height:auto; padding:0; border:0;}

  /* Switch */
  .ios-sw{position:relative; width:50px; height:30px; flex:none; display:inline-block;}
  .ios-sw input{opacity:0; width:0; height:0;}
  .ios-sw i{
    position:absolute; inset:0; border-radius:99px;

/* ===== X-style posts ===== */

.xp{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.xp:last-child{border-bottom:0}
.xp-av,.x-cav{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--cyan);color:#fff;font-weight:800;font-size:1rem}
.xp-av img,.x-cav img{width:100%;height:100%;object-fit:cover;display:block}

.xp-head,.x-ch{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;font-size:.9rem;line-height:1.3}

.xp-ok{display:inline-flex;width:16px;height:16px;color:var(--cyan)}
.xp-ok svg{width:100%;height:100%;stroke-width:2.4}
.xp-sub{color:var(--muted);font-size:.82rem}
.xp-pin{display:inline-flex;align-items:center;gap:3px;margin-left:auto;color:var(--amber);font-size:.72rem;font-weight:800}
.xp-pin svg,.xp-acts svg,.xv-play svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.xp-title{margin-top:4px;font-weight:800;font-size:1rem;color:var(--text)}
.xp-text{margin-top:3px;white-space:pre-wrap;word-break:break-word;color:var(--text);font-size:.95rem;line-height:1.5}
.xp.full .xp-text{font-size:1.02rem}
.xp-text a{color:var(--cyan);text-decoration:none;word-break:break-all}
.x-tag{color:var(--cyan)}
.xp-cat{margin-top:8px}
.xm-grid{display:grid;gap:3px;margin-top:10px;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.xm-grid.n2{grid-template-columns:1fr 1fr;aspect-ratio:16/9}
.xm-grid.n3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:16/9}
.xm-grid.n3 .xm:first-child{grid-row:1/3}
.xm-grid.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:16/9}
.xm{position:relative;background:color-mix(in srgb,var(--text) 8%,transparent);cursor:zoom-in;min-height:90px;overflow:hidden}
.xm img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.xm img.ok{opacity:1}
.xm-grid.n1 .xm img{height:auto;max-height:460px;min-height:120px}
.xm:not(:has(img.ok))::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);background-size:200% 100%;animation:xsh 1.3s linear infinite}
.xm.bad::after{display:none}.xm.bad::before{content:"Photo unavailable";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.8rem}
@keyframes xsh{from{background-position:200% 0}to{background-position:-200% 0}}
.xv{margin-top:10px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#000}
.xv video{display:block;width:100%;max-height:480px;background:#000}

.x-back{border:0;background:transparent;color:var(--cyan);font:800 .95rem var(--fb);padding:4px 2px 12px;cursor:pointer}

  <div class="brand" id="brand" data-view="home"></div>
  <div class="head-actions">
    <button class="me-btn" id="meBtn" data-view="me" aria-label="My profile" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>

<!-- Appearance Studio Bottom Sheet -->

<!-- Confirmation Modal (Canvas-safe replacement for confirm()) -->

      <h4 id="cmTitle">Confirm Action</h4>

<div id="toast" role="status" aria-live="polite"></div>
<main id="app"><div id="boot"><div class="spin"></div>Loading…</div></main>
<a id="fab" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/><path d="M9 9.2c.2 2.6 2.4 4.9 5.3 5.6l1.2-1.3-2-1-.9.6c-.8-.4-1.5-1.1-1.9-1.9l.6-.9-1-2z"/></svg></a>
<nav class="bottom-nav" id="bottomNav" aria-label="Main navigation"></nav>

<script>
const $ = s => document.querySelector(s);
const EMO_RE = /[\u{1F000}-\u{1FAFF}\u2600-\u2604\u2607-\u2712\u2716-\u27BF\u2B50\u2B55\u2B1B\u2B1C\u231A\u231B\u23E9-\u23FF\u200D\uFE0F\u20E3]/gu;
const escE = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const esc = s => String(s ?? "").replace(EMO_RE, "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS = {
  home: I('<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>'),
  services: I('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/>'),
  posts: I('<path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 9h8M8 13h8M8 17h5"/>'),
  events: I('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  register: I('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/>'),
  book: I('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/>'),
  reviews: I('<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'),
  me: I('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>')
};
const TAB_EMOJIS = { home: "", services: "", posts: "", events: "", register: "", book: "", reviews: "", me: "" };
const BOLT = '<svg viewBox="0 0 24 24"><path d="M12 3 1 9l11 6 9-4.9V17h2V9z"/><path d="M5 13.2v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4L12 16.5z"/></svg>';
const STATUS = {pending:"PENDING", confirmed:"CONFIRMED", done:"COMPLETED", cancelled:"CANCELLED"};

let S = VX.clone(VX.DEFAULTS), R = [], view = null, mine = [], bookPrefill = {}, ticketHTML = "";
let bookUrgency = "Individual Class";
let postsTab = "posts", regPrefill = "", regTicketHTML = "", myRegs = [], chatMessages = [];
const STATUS_R = {pending:"PENDING", confirmed:"CONFIRMED", done:"ATTENDED", cancelled:"CANCELLED", declined:"DECLINED"};

/* ---------- Smart Emoji & User Theme Helpers ---------- */
/* UI customization is admin-only: visitors always get the theme set in the admin panel */
const userTheme = () => null;
const userCustom = () => ({});
const effTheme = () => Object.assign({}, S.theme, userCustom());
const emOn = () => effTheme().showEmojis !== false;
const em = (e, fallback="") => emOn() ? e : fallback;

const LEGACY_SVC_EMOJI = {
  "EI": "", "RM": "", "HW": "", "LS": "", "AE": ""
};
function svcIcon(s) { const e = String(s.e || "").trim(); return e ? escE(e) : esc(((s.t || "?").trim()[0] || "?").toUpperCase()); }
function infoIcon(r) { return "•"; }

const tabs = () => S.tabs.filter(t => t.show !== false && t.id !== "reviews");
const split = s => String(s || "").split(",").map(x => x.trim()).filter(Boolean);

let _tt;
function toast(m, bad){
  const t = $("#toast");
  t.textContent = m;
  t.className = "show" + (bad ? " err" : "");
  clearTimeout(_tt);
  _tt = setTimeout(() => t.className = "", 2600);
}

/* Modal Confirm helper */
let _cmCb = null;
function iosConfirm(title, text, onYes) {
  $("#cmTitle").textContent = title;
  $("#cmText").textContent = text;
  _cmCb = onYes;
  $("#confirmModal").classList.add("open");
}
$("#cmNo").onclick = () => { $("#confirmModal").classList.remove("open"); _cmCb = null; };
$("#cmYes").onclick = () => { $("#confirmModal").classList.remove("open"); if (_cmCb) _cmCb(); _cmCb = null; };

/* Clipboard helper with fallback */
function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => toast("Booking ID copied!")).catch(() => fallbackCopy(txt));
  } else {
    fallbackCopy(txt);
  }
}
function fallbackCopy(txt) {
  try {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    toast("Booking ID copied!");
  } catch (e) { toast("Copy failed", 1); }
}

window.addEventListener("scroll", () => document.querySelector("header").classList.toggle("scrolled", scrollY > 8), {passive:true});
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
const ARR = '<svg class="ar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const starsHTML = n => `<span>${STAR.repeat(n)}</span><span class="off">${STAR.repeat(5-n)}</span>`;
const distHTML = rv => rv.length ? `<div class="dist">${[5,4,3,2,1].map(n => { const c = rv.filter(r => r.r === n).length; return `<div><b>${n}★</b><i><u style="width:${Math.round(c/rv.length*100)}%"></u></i><span>${c}</span></div>`; }).join("")}</div>` : "";

function ago(t){
  const m = Math.floor((Date.now() - t) / 60000);
  if(m < 1) return "Just now"; if(m < 60) return m + " min ago";
  const h = Math.floor(m/60); if(h < 24) return h + " hr ago";
  const d = Math.floor(h/24); return d < 30 ? d + " days ago" : new Date(t).toLocaleDateString();
}
const allReviews = () => [
  ...R.filter(r => r.approved).map(r => ({n:r.n, r:r.r, t:r.t, d:ago(r.at)})),
  ...S.reviews.seed.filter(r => r.show !== false)
];
const fill = s => String(s).replace("{address}", S.contact.address).replace("{phone}", S.contact.phoneShow + (S.contact.phoneShow2 ? " / " + S.contact.phoneShow2 : ""));
const typing = () => { const a = document.activeElement; return a && $("#app").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };

/* ---------- Shell & Theme ---------- */
function buildShell(){
  const b = S.brand;
  const logo = b.logoUrl ? `<img src="${esc(b.logoUrl)}" alt="">` : `<span class="lg">${(esc(b.logo) || BOLT)}</span>`;
  $("#brand").innerHTML = `${logo}<div class="brand-text"><div class="brand-title">${esc(b.text1)}<span>${esc(b.text2)}</span></div><div class="brand-sub">${esc(b.tagline)}</div></div>`;
  document.title = `${b.text1}${b.text2} — ${b.tagline}`;
  let fav = document.querySelector("link[rel=icon]"); if(!fav){ fav = document.createElement("link"); fav.rel = "icon"; document.head.appendChild(fav); }
  if(b.logoUrl) fav.href = b.logoUrl;
  const ann = $("#ann");
  if(S.announce.on && S.announce.text){
    ann.style.display = "block"; ann.textContent = S.announce.text;
    ann.style.background = VX.rgba(S.announce.color, .15); ann.style.color = S.announce.color;
  } else ann.style.display = "none";
  const T = tabs().filter(t => t.id !== "me");
  $("#meBtn").style.display = tabs().some(t => t.id === "me") ? "grid" : "none";
  $("#bottomNav").innerHTML = '<i class="nav-pill"></i>' + T.map(t => `<button data-view="${t.id}" class="${t.id==='register'?'book-btn':''}">${ICONS[t.id]}<span>${em(TAB_EMOJIS[t.id] + " ", "")}${esc(t.label)}</span></button>`).join("");
  $("#drawer").innerHTML = `
    <div class="drawer-head"><b>${em("","")}Navigation</b><button class="ios-icon-btn" type="button" data-close-drawer="1" style="height:30px;min-width:30px;padding:0 8px">✕</button></div>
    ${T.map(t => `<button data-view="${t.id}"><span>${em(TAB_EMOJIS[t.id] + "  ", "")}${esc(t.label)}</span><span>›</span></button>`).join("")}`;
  $("#fab").href = `https://wa.me/${S.contact.phone}?text=${encodeURIComponent(S.contact.waMessage)}`;
  VX.applyTheme(S.theme, userTheme(), userCustom());
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#07090e";
  markActive();
}
function placePill(){
  const nav = $("#bottomNav"), p = nav && nav.querySelector(".nav-pill"), a = nav && nav.querySelector("button.active"); if(!p) return;
  if(!a){ p.style.opacity = 0; nav.classList.remove("has-pill"); return; }
  const first = !p.dataset.i; if(first) p.style.transition = "none";
  p.style.width = a.offsetWidth + "px"; p.style.transform = "translateX(" + a.offsetLeft + "px)"; p.style.opacity = 1; nav.classList.add("has-pill");
  if(first){ p.offsetWidth; p.style.transition = ""; p.dataset.i = "1"; }
}
function markActive(){ document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === (view === "post" ? "posts" : view))); placePill(); }
try{ new ResizeObserver(() => placePill()).observe($("#bottomNav")); }catch(_){ window.addEventListener("resize", placePill); }
function toggleDrawer(o){ $("#drawer").classList.toggle("open", o); $("#overlay").classList.toggle("open", o); }
$("#menuToggle").onclick = () => toggleDrawer(!$("#drawer").classList.contains("open"));
$("#overlay").onclick = () => toggleDrawer(false);

/* ---------- Appearance Studio Sheet ---------- */
const SWATCHES = ["#0a84ff", "#00d9ff", "#30d158", "#ffb84d", "#ff375f", "#bf5af2", "#ffd60a", "#ff9f0a"];
function renderStudio() {
  const _sc = $("#studioBody").scrollTop;
  renderStudioInner();
  $("#studioBody").scrollTop = _sc;
}
function renderStudioInner() {
  const ut = userTheme(), uc = userCustom(), eff = effTheme();
  const activePreset = ut || eff.preset || "dark";
  $("#studioBody").innerHTML = `
    <div class="sheet-grab"></div>
    <div class="sheet-top">
      <div>
        <h3>Appearance Studio</h3>
        <small style="color:var(--muted);font-size:.75rem">Customize colors, liquid glass blur, shape & fonts live</small>
      </div>
      <button type="button" class="ios-icon-btn" data-close-studio="1">Done ✓</button>
    </div>

    <label>THEME PRESETS</label>
    <div class="preset-grid">
      ${Object.entries(VX.PRESETS).map(([k, p]) => `
        <button type="button" class="preset-btn ${activePreset === k ? "on" : ""}" data-st-preset="${k}">
          <span class="preset-dot" style="background:linear-gradient(135deg,${p.bg} 45%,${p.a} 45% 75%,${p.b} 75%)">${p.icon || ""}</span>
          <span>${esc(p.name)}</span>
        </button>`).join("")}
    </div>

    <label>ACCENT COLOR & CUSTOM PALETTE</label>
    <div class="studio-group">
      <div class="studio-row">
        <div><b>Use Custom Accent Colors</b><small>Override preset primary & secondary colors</small></div>
        <label class="ios-sw"><input type="checkbox" data-st-toggle="custom" ${eff.custom ? "checked" : ""}><i></i></label>
      </div>
      <div style="padding:10px 0">
        <small style="color:var(--muted);font-size:.72rem;display:block;margin-bottom:6px">Quick Neon Swatches (Primary Accent)</small>
        <div class="swatch-row">
          ${SWATCHES.map(c => `<button type="button" class="swatch ${eff.accent === c && eff.custom ? "on" : ""}" style="background:${c}" data-st-swatch="${c}" aria-label="Color ${c}"></button>`).join("")}
        </div>
        <div style="display:flex;gap:12px;margin-top:8px">
          <div style="flex:1;display:flex;align-items:center;gap:8px">
            <input type="color" value="${esc(eff.accent || "#0a84ff")}" data-st-color="accent" style="width:42px;height:38px;padding:2px;border-radius:10px;cursor:pointer">
            <small style="color:var(--muted);font-size:.74rem">Primary</small>
          </div>
          <div style="flex:1;display:flex;align-items:center;gap:8px">
            <input type="color" value="${esc(eff.accent2 || "#ffb84d")}" data-st-color="accent2" style="width:42px;height:38px;padding:2px;border-radius:10px;cursor:pointer">
            <small style="color:var(--muted);font-size:.74rem">Highlight</small>
          </div>
        </div>
      </div>
    </div>

    <label>LIQUID GLASS & SHAPE</label>
    <div class="studio-group">
      <div class="studio-row">
        <div><b>Frosted Blur Intensity</b><small id="lbl-blur">${eff.blur ?? 24}px backdrop blur</small></div>
        <input type="range" class="studio-slider" min="0" max="36" value="${eff.blur ?? 24}" data-st-range="blur" data-unit="px">
      </div>
      <div class="studio-row">
        <div><b>Card Corner Squircle</b><small id="lbl-radius">${eff.radius ?? 20}px roundness</small></div>
        <input type="range" class="studio-slider" min="8" max="30" value="${eff.radius ?? 20}" data-st-range="radius" data-unit="px">
      </div>
      <div class="studio-row">
        <div><b>Glass Surface Opacity</b><small id="lbl-glass">${eff.glass ?? 6}% translucency</small></div>
        <input type="range" class="studio-slider" min="2" max="18" value="${eff.glass ?? 6}" data-st-range="glass" data-unit="%">
      </div>
    </div>

    <label>TYPOGRAPHY & EXPERIENCE</label>
    <div class="studio-group">
      <div class="studio-row">
        <div><b>App Font Style</b><small>Heading & UI typeface</small></div>
        <select data-st-select="fontHead" style="width:145px;min-height:38px;padding:6px 10px;font-size:.8rem">
          ${Object.keys(VX.FONTS).map(f => `<option value="${esc(f)}" ${eff.fontHead === f ? "selected" : ""}>${esc(f)}</option>`).join("")}
        </select>
      </div>
      <div class="studio-row">
        <div><b>Text Size Scale</b><small id="lbl-fontScale">${eff.fontScale ?? 100}%</small></div>
        <input type="range" class="studio-slider" min="88" max="120" value="${eff.fontScale ?? 100}" data-st-range="fontScale" data-unit="%">
      </div>
      <div class="studio-row">
        <div><b>Ambient Neon Glow</b><small>Soft background radial light</small></div>
        <label class="ios-sw"><input type="checkbox" data-st-toggle="glowOn" ${eff.glowOn !== false ? "checked" : ""}><i></i></label>
      </div>
      <div class="studio-row">
        <div><b>Smooth Spring Motion</b><small>Transitions & micro-animations</small></div>
        <label class="ios-sw"><input type="checkbox" data-st-toggle="animations" ${eff.animations !== false ? "checked" : ""}><i></i></label>
      </div>
    </div>

    <div class="btn-row" style="margin-top:14px">
      <button type="button" class="btn btn-ghost btn-sm" data-st-reset="1">Reset to Default</button>
      <button type="button" class="btn btn-cyan btn-sm" data-close-studio="1">Save & Apply</button>
    </div>`;
}
function openStudio(open) {
  const sh = $("#studioSheet");
  if (open) renderStudio();
  sh.classList.toggle("open", open); sh.setAttribute("aria-hidden", String(!open));
}
$("#studioSheet").addEventListener("click", e => {
  if (e.target === $("#studioSheet") || e.target.closest("[data-close-studio]")) { openStudio(false); return; }
  const pr = e.target.closest("[data-st-preset]");
  if (pr) {
    const k = pr.dataset.stPreset;
    VX.LS.set("vx_user_theme", k);
    const uc = userCustom(); uc.preset = k; VX.LS.set("vx_user_custom", uc);
    buildShell(); render(); renderStudio();
    toast("Theme: " + (VX.PRESETS[k]?.name || k));
    return;
  }
  const sw = e.target.closest("[data-st-swatch]");
  if (sw) {
    const c = sw.dataset.stSwatch;
    const uc = userCustom(); uc.custom = true; uc.accent = c; VX.LS.set("vx_user_custom", uc);
    buildShell(); renderStudio();
    return;
  }
  const rs = e.target.closest("[data-st-reset]");
  if (rs) {
    VX.LS.set("vx_user_theme", null);
    VX.LS.set("vx_user_custom", {});
    buildShell(); render(); renderStudio();
    toast("Reset to default");
  }
});
$("#studioSheet").addEventListener("input", e => {
  const t = e.target, uc = userCustom();
  if (t.dataset.stRange) {
    const k = t.dataset.stRange, v = Number(t.value);
    uc[k] = v; VX.LS.set("vx_user_custom", uc);
    const lbl = $("#lbl-" + k); if (lbl) lbl.textContent = v + (t.dataset.unit || "");
    VX.applyTheme(S.theme, userTheme(), uc);
  } else if (t.dataset.stColor) {
    const k = t.dataset.stColor;
    uc.custom = true; uc[k] = t.value; VX.LS.set("vx_user_custom", uc);
    VX.applyTheme(S.theme, userTheme(), uc);
  } else if (t.dataset.stSelect) {
    const k = t.dataset.stSelect;
    uc[k] = t.value;
    if (k === "fontHead") uc.fontBody = t.value === "Orbitron" || t.value === "Teko" ? "Inter" : t.value;
    VX.LS.set("vx_user_custom", uc);
    VX.applyTheme(S.theme, userTheme(), uc);
  } else if (t.dataset.stToggle) {
    const k = t.dataset.stToggle;
    uc[k] = t.checked; VX.LS.set("vx_user_custom", uc);
    buildShell(); render(); renderStudio();
  }
});

function go(id){
  const T = tabs(); if(!T.length) return;
  let _hid = id;
  if(/^post-/.test(id)){ openPostKey = id.slice(5); id = "post"; _hid = "post-" + openPostKey; }
  if(id !== "post" && !T.some(t => t.id === id)) id = T[0].id, _hid = id;
  if(id !== "book" && id !== view) ticketHTML = "";
  if(id !== "register" && id !== view) regTicketHTML = "";
  view = id; toggleDrawer(false); markActive(); $("#fab").style.display = id === "book" ? "none" : "flex";
  try{ history.replaceState(null, "", "#" + _hid); }catch(e){}
  if(id === "me") loadMine();
  if(id === "register" || id === "me") loadMyRegs();
  render(); window.scrollTo(0,0);
}

document.addEventListener("click", e => {
  if(navigator.vibrate && e.target.closest("button,a,.mini,.svc-pick-card,.cal-day")) navigator.vibrate(8);
  if(e.target.closest("[data-open-studio]")){ toggleDrawer(false); openStudio(true); return; }
  if(e.target.closest("[data-close-drawer]")){ toggleDrawer(false); return; }
  const cp = e.target.closest("[data-copy]"); if(cp){ copyText(cp.dataset.copy); return; }
  const pt = e.target.closest("[data-ptab]"); if(pt){ go(pt.dataset.ptab); return; }
  const rg = e.target.closest("[data-reg]"); if(rg){ regPrefill = rg.dataset.reg; regTicketHTML = ""; go("register"); return; }
  const cxr = e.target.closest("[data-cancel-reg]"); if(cxr){ cancelReg(cxr.dataset.cancelReg); return; }
  const v = e.target.closest("[data-view]"); if(v){ go(v.dataset.view); return; }
  const th = e.target.closest("[data-usertheme]"); if(th){ const m = th.dataset.usertheme; VX.LS.set("vx_user_theme", m === "auto" ? null : m); buildShell(); render(); return; }
  const pk = e.target.closest("[data-book]"); if(pk){ bookPrefill = JSON.parse(pk.dataset.book); if(bookPrefill.urg) bookUrgency = bookPrefill.urg; go("book"); return; }
  const cx = e.target.closest("[data-cancel]"); if(cx){ cancelBooking(cx.dataset.cancel); return; }
});


/* ---------- Posts / Events helpers ---------- */
const MONS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const dParts = d => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d||"")); return m ? {y:+m[1], m:+m[2]-1, d:+m[3]} : null; };
const fmtDate = d => { const p = dParts(d); return p ? p.d + " " + MONS[p.m] + " " + p.y : String(d || ""); };
const livePosts = () => xLivePosts();
const evEnded = e => !!(e.d && String(e.d) < todayStr());
/* upcoming events first (soonest on top), old events after them (newest old first) */
